        }

        function decodeXmlText(str) {
          if (!str || str.indexOf("&") === -1) return str || "";
          return str
            .replace(/&lt;/g, "<")
            .replace(/&gt;/g, ">")
            .replace(/&quot;/g, '"')
            .replace(/&apos;/g, "'")
            .replace(/&#x([0-9a-fA-F]+);/g, function (_, hex) {
              return String.fromCodePoint(parseInt(hex, 16));
            })
            .replace(/&#(\d+);/g, function (_, dec) {
              return String.fromCodePoint(parseInt(dec, 10));
            })
            .replace(/&amp;/g, "&");
        }

        function colRefToIndex(refStr) {
          let col = 0;
          for (let i = 0; i < refStr.length; i++) {
            const code = refStr.charCodeAt(i);
            if (code >= 65 && code <= 90) {
              col = col * 26 + (code - 64);
            } else if (code >= 97 && code <= 122) {
              col = col * 26 + (code - 96);
            } else {
              break;
            }
          }
          return col - 1;
        }

        function extractAttr(tagHeader, attrName) {
          const needle1 = " " + attrName + '="';
          const needle2 = " " + attrName + "='";
          let idx = tagHeader.indexOf(needle1);
          let quote = '"';
          if (idx === -1) {
            idx = tagHeader.indexOf(needle2);
            quote = "'";
          }
          if (idx === -1) return "";
          const start = idx + attrName.length + 3;
          const end = tagHeader.indexOf(quote, start);
          return end === -1 ? "" : tagHeader.slice(start, end);
        }

        function yieldUi() {
          return new Promise(function (resolve) {
            setTimeout(resolve, 0);
          });
        }

        async function parseSharedStrings(xmlText, onProgress) {
          const list = [];
          let pos = 0;
          let count = 0;

          while (true) {
            const siOpen = xmlText.indexOf("<si", pos);
            if (siOpen === -1) break;
            const tagEnd = xmlText.indexOf(">", siOpen);
            if (tagEnd === -1) break;
            if (xmlText.charCodeAt(tagEnd - 1) === 47) {
              list.push("");
              pos = tagEnd + 1;
              continue;
            }
            const siClose = xmlText.indexOf("</si>", tagEnd + 1);
            if (siClose === -1) break;
            const inner = xmlText.slice(tagEnd + 1, siClose);

            let text = "";
            let tPos = 0;
            while (true) {
              const tOpen = inner.indexOf("<t", tPos);
              if (tOpen === -1) break;
              const nextChar = inner.charAt(tOpen + 2);
              if (nextChar !== ">" && nextChar !== " " && nextChar !== "/") {
                tPos = tOpen + 2;
                continue;
              }
              const tTagEnd = inner.indexOf(">", tOpen);
              if (tTagEnd === -1) break;
              if (inner.charCodeAt(tTagEnd - 1) === 47) {
                tPos = tTagEnd + 1;
                continue;
              }
              const tClose = inner.indexOf("</t>", tTagEnd + 1);
              if (tClose === -1) break;
              text += decodeXmlText(inner.slice(tTagEnd + 1, tClose));
              tPos = tClose + 4;
            }
            list.push(text);
            pos = siClose + 5;
            count++;
            if (count % 2500 === 0) {
              if (onProgress) onProgress(count);
              await yieldUi();
            }
          }
          return list;
        }

        function findFirstSheetPath(zip) {
          const fallback = "xl/worksheets/sheet1.xml";
          try {
            const wbBytes = zip.getEntryBytes("xl/workbook.xml");
            const relsBytes = zip.getEntryBytes("xl/_rels/workbook.xml.rels");
            if (!wbBytes || !relsBytes) return fallback;
            const wbXml = utf8Decode(wbBytes);
            const relsXml = utf8Decode(relsBytes);

            const sheetIdx = wbXml.indexOf("<sheet ");
            if (sheetIdx === -1) return fallback;
            const sheetEnd = wbXml.indexOf(">", sheetIdx);
            const sheetTag = wbXml.slice(sheetIdx, sheetEnd + 1);
            const rId = extractAttr(sheetTag, "r:id");
            if (!rId) return fallback;

            let pos = 0;
            while (true) {
              const relIdx = relsXml.indexOf("<Relationship", pos);
              if (relIdx === -1) break;
              const relEnd = relsXml.indexOf(">", relIdx);
              const relTag = relsXml.slice(relIdx, relEnd + 1);
              if (extractAttr(relTag, "Id") === rId) {
                let target = extractAttr(relTag, "Target");
                if (!target) return fallback;
                target = target.replace(/^\/+/, "");
                if (target.indexOf("xl/") !== 0) {
                  target = "xl/" + target;
                }
                return target;
              }
              pos = relEnd + 1;
            }
          } catch (err) {
            return fallback;
          }
          return fallback;
        }

        async function parseWorksheetRows(xmlText, sharedStrings, onProgress) {
          const rows = [];
          const dataStart = xmlText.indexOf("<sheetData");
          if (dataStart === -1) return rows;
          let pos = xmlText.indexOf(">", dataStart);
          if (pos === -1) return rows;
          pos += 1;
          const dataEnd = xmlText.indexOf("</sheetData>", pos);
          const limit = dataEnd === -1 ? xmlText.length : dataEnd;
          const spanLen = Math.max(1, limit - pos);

          let rowCount = 0;
          while (pos < limit) {
            const rowOpen = xmlText.indexOf("<row", pos);
            if (rowOpen === -1 || rowOpen >= limit) break;
            const rowTagEnd = xmlText.indexOf(">", rowOpen);
            if (rowTagEnd === -1 || rowTagEnd >= limit) break;

            if (xmlText.charCodeAt(rowTagEnd - 1) === 47) {
              pos = rowTagEnd + 1;
              continue;
            }
            const rowClose = xmlText.indexOf("</row>", rowTagEnd + 1);
            if (rowClose === -1 || rowClose > limit) break;

            const rowContent = xmlText.slice(rowTagEnd + 1, rowClose);
            const cells = [];
            let cPos = 0;
            let autoCol = 0;

            while (cPos < rowContent.length) {
              const cOpen = rowContent.indexOf("<c", cPos);
              if (cOpen === -1) break;
              const cNext = rowContent.charAt(cOpen + 2);
              if (cNext !== ">" && cNext !== " " && cNext !== "/") {
                cPos = cOpen + 2;
                continue;
              }
              const cTagEnd = rowContent.indexOf(">", cOpen);
              if (cTagEnd === -1) break;

              const cTag = rowContent.slice(cOpen, cTagEnd + 1);
              const refAttr = extractAttr(cTag, "r");
              const colIdx = refAttr ? colRefToIndex(refAttr) : autoCol;
              autoCol = colIdx + 1;

              if (rowContent.charCodeAt(cTagEnd - 1) === 47) {
                cells[colIdx] = "";
                cPos = cTagEnd + 1;
                continue;
              }

              const cClose = rowContent.indexOf("</c>", cTagEnd + 1);
              if (cClose === -1) break;
              const cBody = rowContent.slice(cTagEnd + 1, cClose);
              const cellType = extractAttr(cTag, "t");

              let val = "";
              if (cellType === "inlineStr") {
                let tPos = 0;
                while (true) {
                  const tOpen = cBody.indexOf("<t", tPos);
                  if (tOpen === -1) break;
                  const tEnd = cBody.indexOf(">", tOpen);
                  if (tEnd === -1) break;
                  if (cBody.charCodeAt(tEnd - 1) === 47) {
                    tPos = tEnd + 1;
                    continue;
                  }
                  const tClose = cBody.indexOf("</t>", tEnd + 1);
                  if (tClose === -1) break;
                  val += decodeXmlText(cBody.slice(tEnd + 1, tClose));
                  tPos = tClose + 4;
                }
              } else {
                const vOpen = cBody.indexOf("<v>");
                const vOpenAttr = vOpen === -1 ? cBody.indexOf("<v ") : vOpen;
                if (vOpenAttr !== -1) {
                  const vStart = cBody.indexOf(">", vOpenAttr) + 1;
                  const vClose = cBody.indexOf("</v>", vStart);
                  if (vClose !== -1) {
                    const rawV = decodeXmlText(cBody.slice(vStart, vClose));
                    if (cellType === "s") {
                      const sIdx = parseInt(rawV, 10);
                      val = (sharedStrings && sharedStrings[sIdx] != null) ? sharedStrings[sIdx] : "";
                    } else if (cellType === "b") {
                      val = rawV === "1" ? "TRUE" : "FALSE";
                    } else {
                      val = rawV;
                    }
                  }
                }
              }

              cells[colIdx] = val;
              cPos = cClose + 4;
            }

            const hasAnyNonEmpty = cells.some(function (v) {
              return String(v || "").trim() !== "";
            });
            if (hasAnyNonEmpty) {
              rows.push(cells);
            }

            pos = rowClose + 6;
            rowCount++;
            if (rowCount % 450 === 0) {
              const frac = Math.min(1, (pos - dataStart) / spanLen);
              if (onProgress) onProgress(rowCount, frac);
              await yieldUi();
            }
          }
          return rows;
        }

        function detectColumns(headerRow) {
          let matCol = -1;
          let descCol = -1;
          let catCol = -1;
          let matExact = false;
          let descExact = false;

          const norm = headerRow.map(function (h) {
            return String(h || "").trim().toLowerCase().replace(/[\s_-]+/g, " ");
          });

          norm.forEach(function (h, idx) {
            if (!h) return;
            if (matCol === -1) {
              if (
                h === "material" ||
                h === "material number" ||
                h === "material no" ||
                h === "material #" ||
                h === "matnr" ||
                h === "mat no" ||
                h === "item code" ||
                h === "material code"
              ) {
                matCol = idx;
                matExact = true;
              }
            }
            if (descCol === -1) {
              if (
                h === "old description" ||
                h === "material description" ||
                h === "material description (max 40 char)" ||
                h === "maktx" ||
                h === "short text" ||
                h === "description" ||
                h === "old text" ||
                h === "item description" ||
                h === "desc"
              ) {
                descCol = idx;
                descExact = true;
              }
            }
            if (catCol === -1) {
              if (
                h === "category" ||
                h === "material group" ||
                h === "matl group" ||
                h === "material type" ||
                h === "group" ||
                h === "matkl" ||
                h === "mtart"
              ) {
                catCol = idx;
              }
            }
          });

          if (matCol === -1) {
            norm.forEach(function (h, idx) {
              if (matCol !== -1 || idx === descCol) return;
              if (
                (h.indexOf("mat") !== -1 && (h.indexOf("num") !== -1 || h.indexOf("no") !== -1 || h.indexOf("code") !== -1)) ||
                h === "code" ||
                h === "id"
              ) {
                matCol = idx;
              }
            });
          }

          if (descCol === -1) {
            norm.forEach(function (h, idx) {
              if (descCol !== -1 || idx === matCol) return;
              if (h.indexOf("desc") !== -1 || h.indexOf("text") !== -1 || h.indexOf("name") !== -1) {
                descCol = idx;
              }
            });
          }

          const colCount = headerRow.length;
          if (matCol === -1) matCol = 0;
          if (descCol === -1) descCol = colCount > 1 ? (matCol === 0 ? 1 : 0) : 0;

          return {
            matCol: matCol,
            descCol: descCol,
            catCol: catCol,
            autoMatched: matExact && descExact
          };
        }

        /* ----- Classification by MODULES search words (word-boundary safe) ----- */
        function escapeRegex(s) {
          return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        }

        function makeWordRegex(phrase) {
          const p = escapeRegex(String(phrase || "").trim().toLowerCase()).replace(/\s+/g, "[\\s-]+");
          return new RegExp("(^|[^a-z0-9])" + p + "($|[^a-z0-9])", "i");
        }

        function getModuleMatchers() {
          return MODULES.map(function (mod) {
            const base = String(mod.name || "").trim().toLowerCase();
            const coreSet = {};
            const coreList = [];
            if (base) {
              coreSet[base] = true;
              coreList.push(base);
              if (base.charAt(base.length - 1) !== "s") {
                coreSet[base + "s"] = true;
                coreList.push(base + "s");
              }
            }
            const extraList = [];
            if (Array.isArray(mod.searchWords)) {
              mod.searchWords.forEach(function (w) {
                const lw = String(w || "").trim().toLowerCase();
                if (lw && !coreSet[lw]) {
                  extraList.push(lw);
                }
              });
            }
            const excludeList = [];
            if (Array.isArray(mod.notAScrewWords)) {
              mod.notAScrewWords.forEach(function (w) {
                const lw = String(w || "").trim().toLowerCase();
                if (lw) {
                  excludeList.push(lw);
                }
              });
            }
            const extraRegexes = extraList.map(makeWordRegex);
            if (Array.isArray(mod.searchRegexPatterns)) {
              mod.searchRegexPatterns.forEach(function (rx) {
                if (rx instanceof RegExp) extraRegexes.push(rx);
              });
            }
            return {
              mod: mod,
              coreRegexes: coreList.map(makeWordRegex),
              extraRegexes: extraRegexes,
              excludeRegexes: excludeList.map(makeWordRegex)
            };
          });
        }

        function classifyDescription(oldDesc, matchers) {
          const text = String(oldDesc || "").trim();
          if (!text) return "other";

          const list = matchers || getModuleMatchers();
          for (let u = 0; u < list.length; u++) {
            const uEntry = list[u];
            if (uEntry.mod.id !== "ubolt") continue;
            const uExcluded = uEntry.excludeRegexes && uEntry.excludeRegexes.some(function (rx) {
              return rx.test(text);
            });
            if (!uExcluded) {
              const uMatched = uEntry.coreRegexes.some(function (rx) { return rx.test(text); }) ||
                uEntry.extraRegexes.some(function (rx) { return rx.test(text); });
              if (uMatched) return "ubolt";
            }
          }

          let bestId = "other";
          let bestScore = 0;

          for (let i = 0; i < list.length; i++) {
            const entry = list[i];
            let excluded = false;
            if (entry.excludeRegexes && entry.excludeRegexes.length > 0) {
              for (let x = 0; x < entry.excludeRegexes.length; x++) {
                if (entry.excludeRegexes[x].test(text)) {
                  excluded = true;
                  break;
                }
              }
            }
            if (excluded) continue;

            let score = 0;
            for (let c = 0; c < entry.coreRegexes.length; c++) {
              if (entry.coreRegexes[c].test(text)) {
                score = 2;
                break;
              }
            }
            if (score === 0) {
              for (let e = 0; e < entry.extraRegexes.length; e++) {
                if (entry.extraRegexes[e].test(text)) {
                  score = 1;
                  break;
                }
              }
            }
            if (score > bestScore) {
              bestScore = score;
              bestId = entry.mod.id;
              if (score === 2 && i === 0) {
                /* Bolt core word match cannot be beaten */
                break;
              }
            }
          }
          return bestId;
        }

        /* ----- Safe pre-filling from old text (never guesses!) ----- */
        function hasUpperWord(text, word) {
          const escaped = escapeRegex(String(word || "").trim().toUpperCase()).replace(/\s+/g, "[\\s-]+");
          const re = new RegExp("(^|[^A-Z0-9])" + escaped + "($|[^A-Z0-9])");
          return re.test(text);
        }

        function prefillFields(mod, oldDesc) {
          const text = String(oldDesc || "").trim().toUpperCase().replace(/\s+/g, " ");
          const lists = (mod && mod.lists) ? mod.lists : {};
          const values = {};

          if (!text) return values;

          /* Safe Material match (for modules that have lists.material) */
          if (Array.isArray(lists.material)) {
            let mat = "";
            for (let i = 0; i < lists.material.length; i++) {
              const code = lists.material[i];
              if (hasUpperWord(text, code)) {
                mat = code;
                break;
              }
            }
            if (!mat) {
              if (lists.material.indexOf("MS") !== -1 && hasUpperWord(text, "MILD STEEL")) mat = "MS";
              else if (lists.material.indexOf("CS") !== -1 && hasUpperWord(text, "CARBON STEEL")) mat = "CS";
              else if (lists.material.indexOf("SS") !== -1 && (hasUpperWord(text, "STAINLESS STEEL") || /\bSS\d{3}\b/.test(text))) mat = "SS";
              else if (lists.material.indexOf("GI") !== -1 && (hasUpperWord(text, "GALVANIZED") || hasUpperWord(text, "GALVANISED"))) mat = "GI";
              else if (lists.material.indexOf("CI") !== -1 && hasUpperWord(text, "CAST IRON")) mat = "CI";
              else if (lists.material.indexOf("HT") !== -1 && hasUpperWord(text, "HIGH TENSILE")) mat = "HT";
              else if ((mod.id === "elbow" || mod.id === "tee" || mod.id === "reducer") && lists.material.indexOf("MS") !== -1 && hasUpperWord(text, "STEEL")) mat = "MS";
            }
            if (mat) values.material = mat;
          }

          /* Safe Grade match */
          if (Array.isArray(lists.grade)) {
            let grade = "";
            for (let i = 0; i < lists.grade.length; i++) {
              const g = lists.grade[i];
              if (hasUpperWord(text, g)) {
                grade = g;
                break;
              }
            }
            if (!grade) {
              if (lists.grade.indexOf("G8.8") !== -1 && /(?:^|[^0-9.])(?:GR\.?\s*|GRADE\s*)?8\.8(?:$|[^0-9.])/.test(text)) grade = "G8.8";
              else if (lists.grade.indexOf("G10.9") !== -1 && /(?:^|[^0-9.])(?:GR\.?\s*|GRADE\s*)?10\.9(?:$|[^0-9.])/.test(text)) grade = "G10.9";
              else if (lists.grade.indexOf("G12.9") !== -1 && /(?:^|[^0-9.])(?:GR\.?\s*|GRADE\s*)?12\.9(?:$|[^0-9.])/.test(text)) grade = "G12.9";
              else if (lists.grade.indexOf("A2-70") !== -1 && /\bA2[\s-]?70\b/.test(text)) grade = "A2-70";
            }
            if (grade) values.grade = grade;
          }

          /* Safe Thread match */
          if (Array.isArray(lists.thread)) {
            if (lists.thread.indexOf("FULL THD") !== -1 && (hasUpperWord(text, "FULL THD") || hasUpperWord(text, "FULL THREAD") || hasUpperWord(text, "FULLY THREADED"))) {
              values.thread = "FULL THD";
            } else if (lists.thread.indexOf("HALF THD") !== -1 && (hasUpperWord(text, "HALF THD") || hasUpperWord(text, "HALF THREAD") || hasUpperWord(text, "HALF THREADED"))) {
              values.thread = "HALF THD";
            } else if (lists.thread.indexOf("QTR THD") !== -1 && (hasUpperWord(text, "QTR THD") || hasUpperWord(text, "QUARTER THREAD") || hasUpperWord(text, "QUARTER THREADED"))) {
              values.thread = "QTR THD";
            }
          }

          /* Safe Type match */
          if (Array.isArray(lists.type)) {
            /* Check longer / multi-word names first so WEDGE ANCHOR beats ANCHOR */
            const sortedTypes = lists.type.slice().sort(function (a, b) {
              return b.length - a.length;
            });
            for (let i = 0; i < sortedTypes.length; i++) {
              const tCode = sortedTypes[i];
              if (hasUpperWord(text, tCode)) {
                values.type = tCode;
                break;
              }
            }
            if (!values.type) {
              if (mod.id === "bolt") {
                if (hasUpperWord(text, "HEXAGON") || hasUpperWord(text, "HEX HEAD")) values.type = "HEX";
                else if (hasUpperWord(text, "SOCKET HEAD")) values.type = "ALLEN";
              } else if (mod.id === "nut") {
                if (hasUpperWord(text, "HEXAGON")) values.type = "HEX";
              } else if (mod.id === "screw") {
                if (hasUpperWord(text, "SOCKET HEAD")) values.type = "ALLEN";
                else if (hasUpperWord(text, "COUNTERSUNK")) values.type = "CSK";
                else if (hasUpperWord(text, "PHILLIPS")) values.type = "PH";
                else if (hasUpperWord(text, "SELF DRILLING")) values.type = "SD";
                else if (hasUpperWord(text, "SELF TAPPING")) values.type = "ST";
              }
            }
          }

          /* Safe M-Size / Pitch / Length match */
          if (Array.isArray(lists.diameter)) {
            const m3 = text.match(/(?:^|[^A-Z0-9])M(\d+)\s*[X*]\s*(\d+(?:\.\d+)?)\s*[X*]\s*(\d+(?:\.\d+)?)(?:$|[^A-Z0-9])/);
            const m2 = !m3 ? text.match(/(?:^|[^A-Z0-9])M(\d+)\s*[X*]\s*(\d+(?:\.\d+)?)(?:$|[^A-Z0-9])/) : null;
            const m1 = (!m3 && !m2) ? text.match(/(?:^|[^A-Z0-9])M(\d+)(?:$|[^A-Z0-9])/) : null;

            if (m3) {
              const dCode = "M" + m3[1];
              if (lists.diameter.indexOf(dCode) !== -1) values.diameter = dCode;
              if (mod.id === "bolt") {
                values.length = m3[2];
                values.pitch = m3[3];
              } else {
                values.pitch = m3[2];
                if (mod.id !== "nut") values.length = m3[3];
              }
            } else if (m2) {
              const dCode = "M" + m2[1];
              if (lists.diameter.indexOf(dCode) !== -1) values.diameter = dCode;
              if (mod.id === "nut") {
                values.pitch = m2[2];
              } else {
                values.length = m2[2];
              }
            } else if (m1) {
              const dCode = "M" + m1[1];
              if (lists.diameter.indexOf(dCode) !== -1) values.diameter = dCode;
            }
          }

          /* Safe Bolt "With nut" match */
          if (mod.id === "bolt") {
            if (hasUpperWord(text, "WITH NUT")) {
              values.withNut = "Yes";
            }
          }

          /* Safe Hose pre-fill */
          if (mod.id === "hose") {
            if (hasUpperWord(text, "WW") || hasUpperWord(text, "WIRE WOUND")) values.construction = "WW";
            else if (hasUpperWord(text, "SB") || hasUpperWord(text, "STEEL BRAIDED")) values.construction = "SB";
            else if (hasUpperWord(text, "SS") || hasUpperWord(text, "STAINLESS")) values.construction = "SS";

            if (hasUpperWord(text, "HHP") || hasUpperWord(text, "HYDRAULIC")) values.kind = "HHP";
            else if (hasUpperWord(text, "WHP") || hasUpperWord(text, "WATER")) values.kind = "WHP";

            const lenM = text.match(/(?:^|[^A-Z0-9])L\s*=\s*(\d+(?:\.\d+)?)\s*M(?:$|[^A-Z0-9])/);
            if (lenM) values.length = lenM[1];

            const wpM = text.match(/(?:^|[^A-Z0-9])WP\s*(\d+(?:\.\d+)?)\s*(BAR|PSI|B|P)(?:$|[^A-Z0-9])/);
            const barPsiM = !wpM ? text.match(/(?:^|[^A-Z0-9])(\d+(?:\.\d+)?)\s*(BAR|PSI)(?:$|[^A-Z0-9])/) : null;
            if (wpM) {
              values.pressure = wpM[1];
              values.unit = (wpM[2].charAt(0) === "P") ? "p" : "b";
            } else if (barPsiM) {
              values.pressure = barPsiM[1];
              values.unit = (barPsiM[2] === "PSI") ? "p" : "b";
            }
          }

          /* Safe Sand paper grit pre-fill (e.g. "emery paper p80" -> P80) */
          if (mod.id === "sandpaper" && Array.isArray(lists.grit)) {
            const pMatch = text.match(/(?:^|[^A-Z0-9])P\s*(\d{2,3})(?:$|[^A-Z0-9])/);
            const gritWordMatch = !pMatch
              ? (text.match(/(?:^|[^A-Z0-9])GRIT\s*[:#-]?\s*P?(\d{2,3})(?:$|[^A-Z0-9])/) ||
                 text.match(/(?:^|[^A-Z0-9])(\d{2,3})\s*GRIT(?:$|[^A-Z0-9])/))
              : null;
            const rawNum = pMatch ? pMatch[1] : (gritWordMatch ? gritWordMatch[1] : "");
            if (rawNum) {
              const gCode = "P" + rawNum;
              if (lists.grit.indexOf(gCode) !== -1) {
                values.grit = gCode;
              }
            }
          }

          return values;
        }

        /* ----- Build / rebuild items list from uploaded rows + saved decisions ----- */
        async function buildItemsFromRows(onProgress) {
          const matchers = getModuleMatchers();
          const decisions = loadDecisions();
          const out = [];
          const rows = state.rawRows;
          const total = rows.length;

          for (let i = 0; i < total; i++) {
            const r = rows[i];
            const matNo = String(r[state.matCol] != null ? r[state.matCol] : "").trim();
            const oldDesc = String(r[state.descCol] != null ? r[state.descCol] : "").trim();
            const catVal = (state.catCol >= 0 && r[state.catCol] != null) ? String(r[state.catCol]).trim() : "";

            const autoKindId = classifyDescription(oldDesc, matchers);
            const saved = matNo ? (decisions[matNo] || null) : null;

            let kindId = autoKindId;
            let status = "new";
            let shortName = "";
            let longText = "";
            let fields = null;

            if (saved) {
              if (saved.status === "other") {
                kindId = "other";
                status = "other";
                shortName = saved.shortName || "";
                longText = saved.longText || "";
                fields = saved.fields || null;
              } else if (saved.status === "accepted" || saved.status === "skipped") {
                if (saved.moduleId && MODULES.some(function (m) { return m.id === saved.moduleId; })) {
                  kindId = saved.moduleId;
                }
                status = saved.status;
                shortName = saved.shortName || "";
                longText = saved.longText || "";
                fields = saved.fields || null;
              }
            }

            out.push({
              rowIndex: i,
              materialNumber: matNo,
              oldDescription: oldDesc,
              category: catVal,
              autoKindId: autoKindId,
              kindId: kindId,
              status: status,
              fields: fields,
              shortName: shortName,
              longText: longText
            });

            if ((i + 1) % 500 === 0 || i + 1 === total) {
              if (onProgress) onProgress(i + 1, total);
              if (total > 600) await yieldUi();
            }
          }

          state.items = out;
        }

        async function loadExcelArrayBuffer(arrayBuffer, fileName, onProgress) {
          state.loading = true;
          state.error = "";
          state.progressPct = 5;
          state.progressText = "Opening Excel file...";
          if (onProgress) onProgress(5, state.progressText);
          await yieldUi();

          const bytes = new Uint8Array(arrayBuffer);
          const zip = readZipEntries(bytes);

          state.progressPct = 15;
          state.progressText = "Reading text table...";
          if (onProgress) onProgress(15, state.progressText);

          let sharedStrings = [];
          const ssBytes = zip.getEntryBytes("xl/sharedStrings.xml");
          if (ssBytes) {
            const ssXml = utf8Decode(ssBytes);
            sharedStrings = await parseSharedStrings(ssXml, function (cnt) {
              if (onProgress) onProgress(22, "Reading text table (" + cnt.toLocaleString() + ")...");
            });
          }

          const sheetPath = findFirstSheetPath(zip);
          const sheetBytes = zip.getEntryBytes(sheetPath);
          if (!sheetBytes) {
            throw new Error("Could not find worksheet inside .xlsx");
          }

          state.progressPct = 30;
          state.progressText = "Reading rows...";
          if (onProgress) onProgress(30, state.progressText);
          await yieldUi();

          const sheetXml = utf8Decode(sheetBytes);
          const allRows = await parseWorksheetRows(sheetXml, sharedStrings, function (rowCnt, frac) {
            const pct = Math.min(82, Math.round(30 + frac * 52));
            state.progressPct = pct;
            state.progressText = "Reading rows: " + rowCnt.toLocaleString() + "...";
            if (onProgress) onProgress(pct, state.progressText);
          });

          if (allRows.length < 2) {
            throw new Error("No data rows found in this Excel sheet.");
          }

          const headerRow = allRows[0].map(function (h) {
            return String(h == null ? "" : h).trim();
          });
          const dataRows = allRows.slice(1);
          const colInfo = detectColumns(headerRow);

          state.fileName = fileName || "SAP_Upload.xlsx";
          state.headers = headerRow;
          state.rawRows = dataRows;
          state.matCol = colInfo.matCol;
          state.descCol = colInfo.descCol;
          state.catCol = colInfo.catCol;
          state.columnsAutoMatched = colInfo.autoMatched;

          state.progressPct = 84;
          state.progressText = "Sorting " + dataRows.length.toLocaleString() + " materials...";
          if (onProgress) onProgress(84, state.progressText);

          await buildItemsFromRows(function (done, total) {
            const pct = 84 + Math.round((done / Math.max(1, total)) * 16);
            state.progressPct = pct;
            state.progressText = "Sorting: " + done.toLocaleString() + " / " + total.toLocaleString();
            if (onProgress) onProgress(pct, state.progressText);
          });

          state.loading = false;
          state.progressPct = 100;
          state.progressText = "Done";
          saveUploadedTotal(dataRows.length);
          return state;
        }

        async function remapColumns(matCol, descCol) {
          state.matCol = matCol;
          state.descCol = descCol;
          await buildItemsFromRows();
        }

        function getKindStats() {
          const map = {};
          MODULES.forEach(function (mod) {
            map[mod.id] = {
              id: mod.id,
              name: mod.name,
              tileBg: mod.tileBg,
              tileColor: mod.tileColor,
              iconSvg: mod.iconSvg,
              total: 0,
              accepted: 0,
              skipped: 0,
              newCount: 0
            };
          });
          map.other = {
            id: "other",
            name: "Other",
            tileBg: "#EAF3EF",
            tileColor: "#4A635B",
            iconSvg:
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                '<circle cx="12" cy="12" r="9"></circle>' +
                '<path d="M9.5 9.5a2.5 2.5 0 0 1 5 .5c0 1.5-2.5 2-2.5 3.5"></path>' +
                '<circle cx="12" cy="17" r="0.6" fill="currentColor"></circle>' +
              '</svg>',
            total: 0,
            accepted: 0,
            skipped: 0,
            newCount: 0
          };

          state.items.forEach(function (item) {
            const bucket = map[item.kindId] || map.other;
            bucket.total++;
            if (item.status === "accepted") bucket.accepted++;
            else if (item.status === "skipped") bucket.skipped++;
            else bucket.newCount++;
          });

          const list = MODULES.map(function (m) { return map[m.id]; });
          list.push(map.other);
          return { list: list, byId: map };
        }

        function updateItemDecision(item, status, payload) {
          item.status = status;
          if (payload) {
            if (payload.kindId) item.kindId = payload.kindId;
            if (payload.fields !== undefined) item.fields = payload.fields;
            if (payload.shortName !== undefined) item.shortName = payload.shortName;
            if (payload.longText !== undefined) item.longText = payload.longText;
          }
          if (item.materialNumber) {
            setDecision(item.materialNumber, {
              status: item.status,
              moduleId: item.kindId,
              fields: item.fields,
              shortName: item.shortName,
              longText: item.longText
            });
          }
        }

        function formatStatusLabel(status) {
          if (status === "accepted") return "Accepted";
          if (status === "skipped") return "Skipped";
          if (status === "other") return "Other";
          return "New";
        }

        function buildReviewExportRows() {
          return state.items.map(function (item) {
            return [
              item.materialNumber,
              item.oldDescription,
              item.shortName || "",
              item.longText || "",
              formatStatusLabel(item.status)
            ];
          });
        }

        function downloadReviewExcel() {
          if (state.items.length === 0) return null;
          const columns = [
            { header: "Material Number", width: 22 },
            { header: "Old Description", width: 46 },
            { header: "New Short Name", width: 42 },
            { header: "New Long Text", width: 60, styleIndex: 2 },
            { header: "Status", width: 14 }
          ];
          const rows = buildReviewExportRows();
          const bytes = QSExport.createTableXlsxBytes(columns, rows, "Sheet1");
          const d = new Date();
          const stamp = String(d.getFullYear()) +
            String(d.getMonth() + 1).padStart(2, "0") +
            String(d.getDate()).padStart(2, "0");
          QSExport.downloadBytes(bytes, "Existing_Review_" + stamp + ".xlsx");
          return {
            rowsIn: state.rawRows.length,
            rowsOut: rows.length
          };
        }

        /* ----- Render Fields for Any Module Inside Review Screen ----- */
        function getFieldsSpec(mod) {
          if (mod.id === "bolt") {
            return [
              { key: "material", label: "Material", type: "select", required: false, options: mod.lists.material, placeholder: "Select material" },
              { key: "type", label: "Type", type: "select", required: true, options: mod.lists.type, placeholder: "Select type" },
              { key: "diameter", label: "Diameter", type: "select", required: true, options: mod.lists.diameter, placeholder: "Select diameter" },
              { key: "length", label: "Length in mm", type: "number", required: true, placeholder: "e.g. 65" },
              { key: "pitch", label: "Pitch, the third number", type: "text", required: false, placeholder: "e.g. 1.5" },
              { key: "thread", label: "Thread", type: "select", required: false, options: mod.lists.thread, placeholder: "Select thread" },
              { key: "grade", label: "Grade", type: "select", required: true, options: mod.lists.grade, placeholder: "Select grade" },
              { key: "machine", label: "For machine", type: "text", required: false, placeholder: "e.g. ROLLING MILL" },

              { key: "kind", label: "Kind", type: "select", required: true, options: mod.lists.kind, placeholder: "Select kind" },

              { sectionTitle: "END 1" },
              { key: "end1Size", label: "Size", type: "select", required: true, options: mod.lists.size, placeholder: "Select size" },
              { key: "end1Shape", label: "Shape", type: "select", required: true, options: mod.lists.shape, placeholder: "Select shape" },
              { key: "end1Gender", label: "Gender", type: "select", required: true, options: mod.lists.gender, placeholder: "Select gender" },
              { key: "end1Thread", label: "Thread", type: "text", required: false, placeholder: "e.g. BSP" },
              { sectionTitle: "END 2" },
              { key: "end2Size", label: "Size", type: "select", required: true, options: mod.lists.size, placeholder: "Select size" },
              { key: "end2Shape", label: "Shape", type: "select", required: true, options: mod.lists.shape, placeholder: "Select shape" },
              { key: "end2Gender", label: "Gender", type: "select", required: true, options: mod.lists.gender, placeholder: "Select gender" },
              { key: "end2Thread", label: "Thread", type: "text", required: false, placeholder: "e.g. BSP" },
              { sectionTitle: "WORKING PRESSURE" },
              { key: "pressure", label: "Working pressure", type: "number", required: true, placeholder: "e.g. 210" },
              { key: "unit", label: "Pressure unit", type: "select", required: true, options: mod.lists.unit, placeholder: "Select unit" }
            ];
          }
          if (mod.id === "nut") {
            return [
              { key: "material", label: "Material", type: "select", required: false, options: mod.lists.material, placeholder: "Select material" },
              { key: "type", label: "Type", type: "select", required: true, options: mod.lists.type, placeholder: "Select type" },
              { key: "diameter", label: "Diameter", type: "select", required: true, options: mod.lists.diameter, placeholder: "Select diameter" },
              { key: "pitch", label: "Pitch", type: "text", required: false, placeholder: "e.g. 4" },
              { key: "grade", label: "Grade", type: "select", required: true, options: mod.lists.grade, placeholder: "Select grade" },
              { key: "machine", label: "For machine", type: "text", required: false, placeholder: "e.g. ROLLING MILL" }
            ];
          }
          if (mod.id === "screw") {
            return [
              { key: "material", label: "Material", type: "select", required: false, options: mod.lists.material, placeholder: "Select material" },
              { key: "type", label: "Type", type: "select", required: true, options: mod.lists.type, placeholder: "Select type" },
              { key: "diameter", label: "Diameter", type: "select", required: true, options: mod.lists.diameter, placeholder: "Select diameter" },
              { key: "length", label: "Length in mm", type: "number", required: true, placeholder: "e.g. 30" },
              { key: "pitch", label: "Pitch", type: "text", required: false, placeholder: "e.g. 1.25" },
              { key: "thread", label: "Thread", type: "select", required: false, options: mod.lists.thread, placeholder: "Select thread" },
              { key: "grade", label: "Grade", type: "select", required: false, options: mod.lists.grade, placeholder: "Select grade" },
              { key: "head", label: "Head", type: "number", required: false, placeholder: "e.g. 5" },
              { key: "forText", label: "For", type: "text", required: false, placeholder: "e.g. GUIDEBOX" }
            ];
          }
          if (mod.id === "sandpaper") {
            return [
              { key: "grit", label: "Grit", type: "select", required: true, options: mod.lists.grit, placeholder: "Select grit" }
            ];
          }
          /* Automatic fallback for any future module */
          const autoSpec = [];
          if (mod.lists && typeof mod.lists === "object") {
            Object.keys(mod.lists).forEach(function (k) {
              const arr = mod.lists[k];
              if (Array.isArray(arr)) {
                autoSpec.push({
                  key: k,
                  label: k.charAt(0).toUpperCase() + k.slice(1),
                  type: "select",
                  required: false,
                  options: arr,
                  placeholder: "Select " + k
                });
              }
            });
          }
          return autoSpec;
        }

        return {
          state: state,
          loadDecisions: loadDecisions,
          setDecision: setDecision,
          getDecision: getDecision,
          getSavedDecisionCounts: getSavedDecisionCounts,
          getUploadedTotal: getUploadedTotal,
          loadExcelArrayBuffer: loadExcelArrayBuffer,
          remapColumns: remapColumns,
          classifyDescription: classifyDescription,
          prefillFields: prefillFields,
          getKindStats: getKindStats,
          updateItemDecision: updateItemDecision,
          formatStatusLabel: formatStatusLabel,
          buildReviewExportRows: buildReviewExportRows,
          downloadReviewExcel: downloadReviewExcel,
          getFieldsSpec: getFieldsSpec
        };
      })();

    <!-- =========================================================
         PAGE CODE
         Navigation, page switching, home animations, and touch feedback
         ========================================================= -->
    <script>
      (function () {
        const pageRoot = document.getElementById("page-root");
        const navButtons = Array.from(document.querySelectorAll(".nav-btn"));
        const reduceMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

        let currentPage = "home";
        let labelHideTimer = null;
        let activeCountFrames = [];
        let deferredInstallPrompt = null;

        function toLocalDateKey(dateObj) {
          const y = dateObj.getFullYear();
          const m = String(dateObj.getMonth() + 1).padStart(2, "0");
          const d = String(dateObj.getDate()).padStart(2, "0");
          return y + "-" + m + "-" + d;
        }

        function getHomeMetrics() {
          const now = new Date();
          const todayKey = toLocalDateKey(now);
          const diffToMon = (now.getDay() + 6) % 7;
          const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToMon);
          const dayLabels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
          const weekBuckets = {};
          const weekly = dayLabels.map(function (label, idx) {
            const key = toLocalDateKey(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + idx));
            const entry = { day: label, key: key, value: 0 };
            weekBuckets[key] = entry;
            return entry;
          });

          let openedToday = 0;
          const log = QSExport.getOpenedLog();
          log.forEach(function (ts) {
            const dt = new Date(ts);
            if (isNaN(dt.getTime())) return;
            const k = toLocalDateKey(dt);
            if (k === todayKey) openedToday++;
            if (weekBuckets[k]) weekBuckets[k].value++;
          });

          const decisionCounts = QSExisting.getSavedDecisionCounts();
          const uploadedTotal = QSExisting.getUploadedTotal();
          const hasUploaded = uploadedTotal !== null;
          const accepted = decisionCounts.accepted;
          const waiting = hasUploaded ? Math.max(0, uploadedTotal - decisionCounts.accepted - decisionCounts.skipped) : null;
          const progressPct = (hasUploaded && uploadedTotal > 0)
            ? Math.min(100, Math.round((accepted / uploadedTotal) * 100))
            : 0;

          return {
            openedToday: openedToday,
            weekly: weekly,
            accepted: accepted,
            uploadedTotal: uploadedTotal,
            hasUploaded: hasUploaded,
            waiting: waiting,
            progressPct: progressPct
          };
        }

        function prefersReducedMotion() {
          return reduceMotionQuery.matches;
        }

        function cancelCountAnimations() {
          activeCountFrames.forEach(function (id) {
            cancelAnimationFrame(id);
          });
          activeCountFrames = [];
        }

        function animateCount(element, targetValue, durationMs, suffix) {
          if (!element) return;
          const tail = suffix || "";

          if (prefersReducedMotion()) {
            element.textContent = targetValue.toLocaleString() + tail;
            return;
          }

          const startTime = performance.now();

          function tick(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / durationMs, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            const current = Math.round(targetValue * eased);
            element.textContent = current.toLocaleString() + tail;

            if (progress < 1) {
              const id = requestAnimationFrame(tick);
              activeCountFrames.push(id);
            }
          }

          const id = requestAnimationFrame(tick);
          activeCountFrames.push(id);
        }

        function attachCardTouchLift(container) {
          const cards = container.querySelectorAll(".card");
          cards.forEach(function (card) {
            card.addEventListener("touchstart", function () {
              card.classList.add("is-touched");
            }, { passive: true });

            card.addEventListener("touchend", function () {
              setTimeout(function () {
                card.classList.remove("is-touched");
              }, 160);
            }, { passive: true });

            card.addEventListener("touchcancel", function () {
              card.classList.remove("is-touched");
            }, { passive: true });
          });
        }

        function showSidebarLabel(navItem) {
          document.querySelectorAll(".nav-item.show-label").forEach(function (item) {
            item.classList.remove("show-label");
          });
          navItem.classList.add("show-label");
          if (labelHideTimer) clearTimeout(labelHideTimer);
          labelHideTimer = setTimeout(function () {
            navItem.classList.remove("show-label");
          }, 1400);
        }

        function renderHomePage() {
          const metrics = getHomeMetrics();
          const maxBarValue = Math.max.apply(null, metrics.weekly.map(function (d) { return d.value; }));

          const barsHtml = metrics.weekly.map(function (item, idx) {
            const heightPct = maxBarValue > 0 ? Math.round((item.value / maxBarValue) * 100) : 0;
            const tallestClass = (maxBarValue > 0 && item.value === maxBarValue) ? " is-tallest" : "";
            return (
              '<div class="bar-col">' +
                '<div class="bar-track">' +
                  '<div class="bar-fill' + tallestClass + '" data-bar-index="' + idx + '" style="height:' + heightPct + '%; transition-delay:' + (idx * 50) + 'ms;"></div>' +
                '</div>' +
                '<span class="bar-day">' + item.day + '</span>' +
              '</div>'
            );
          }).join("");

          const initialFixedText = "0 / " + (metrics.hasUploaded ? metrics.uploadedTotal.toLocaleString() : "-");
          const fixedSuffix = " / " + (metrics.hasUploaded ? metrics.uploadedTotal.toLocaleString() : "-");
          const installHiddenClass = deferredInstallPrompt ? "" : " is-hidden";

          pageRoot.innerHTML =
            '<section class="card welcome-card card-stagger" style="--card-index: 0;">' +
              '<h1 class="welcome-title">Code opening, <span class="faster-word">faster</span></h1>' +
              '<p class="welcome-subtitle">Consistent 40-character SAP short and long texts from one offline screen.</p>' +
              '<div class="welcome-actions">' +
                '<button type="button" class="primary-orange-btn" id="open-new-code-btn">Open a new code</button>' +
                '<button type="button" class="btn-secondary install-app-btn' + installHiddenClass + '" id="install-app-btn">Install app</button>' +
              '</div>' +
            '</section>' +

            '<div class="stats-row">' +
              '<section class="card stat-card card-stagger" style="--card-index: 1;">' +
                '<h2 class="card-label">Codes opened today</h2>' +
                '<p class="stat-value" id="stat-today">0</p>' +
              '</section>' +

              '<section class="card stat-card card-stagger" style="--card-index: 2;">' +
                '<h2 class="card-label">Waiting in Tab 2</h2>' +
                '<p class="stat-value" id="stat-waiting">' + (metrics.hasUploaded ? '0' : '-') + '</p>' +
              '</section>' +
            '</div>' +

            '<section class="card card-stagger" style="--card-index: 3;">' +
              '<div class="progress-header">' +
                '<h2 class="card-label">Existing materials fixed</h2>' +
                '<span class="progress-numbers" id="stat-fixed">' + initialFixedText + '</span>' +
              '</div>' +
              '<div class="progress-track" role="progressbar" aria-valuenow="' + metrics.progressPct + '" aria-valuemin="0" aria-valuemax="100" aria-label="Existing materials fixed">' +
                '<div class="progress-fill" id="fixed-progress-fill" style="width: ' + metrics.progressPct + '%;"></div>' +
              '</div>' +
              '<div class="progress-footer">' +
                '<span class="progress-percent">' + metrics.progressPct + '%</span>' +
              '</div>' +
            '</section>' +

            '<section class="card card-stagger" style="--card-index: 4;">' +
              '<div class="chart-header">' +
                '<h2 class="card-label">Codes opened this week</h2>' +
              '</div>' +
              '<div class="bars-grid" aria-label="Codes opened from Monday to Sunday">' +
                barsHtml +
              '</div>' +
            '</section>';

          const openRulesBtn = document.getElementById("open-new-code-btn");
          if (openRulesBtn) {
            openRulesBtn.addEventListener("click", function () {
              switchPage("rules");
            });
          }

          const installBtn = document.getElementById("install-app-btn");
          if (installBtn) {
            installBtn.addEventListener("click", function () {
              if (!deferredInstallPrompt) return;
              const promptEv = deferredInstallPrompt;
              deferredInstallPrompt = null;
              installBtn.classList.add("is-hidden");
              try {
                promptEv.prompt();
                if (promptEv.userChoice && typeof promptEv.userChoice.then === "function") {
                  promptEv.userChoice.then(function () {
                    installBtn.classList.add("is-hidden");
                  }).catch(function () {});
                }
              } catch (err) {
                /* Ignore prompt errors */
              }
            });
          }

          animateCount(document.getElementById("stat-today"), metrics.openedToday, 700);
          if (metrics.hasUploaded) {
            animateCount(document.getElementById("stat-waiting"), metrics.waiting, 900);
          } else {
            const waitingEl = document.getElementById("stat-waiting");
            if (waitingEl) waitingEl.textContent = "-";
          }
          animateCount(document.getElementById("stat-fixed"), metrics.accepted, 850, fixedSuffix);

          const progressFill = document.getElementById("fixed-progress-fill");
          const barFills = pageRoot.querySelectorAll(".bar-fill");

          if (prefersReducedMotion()) {
            if (progressFill) progressFill.classList.add("is-grown");
            barFills.forEach(function (bar) { bar.classList.add("is-grown"); });
          } else {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                if (progressFill) progressFill.classList.add("is-grown");
                barFills.forEach(function (bar) { bar.classList.add("is-grown"); });
              });
            });
          }
        }

        function renderPlaceholderCard(title) {
          pageRoot.innerHTML =
            '<section class="card card-stagger" style="--card-index: 0;">' +
              '<h1 class="placeholder-title">' + title + '</h1>' +
              '<p class="placeholder-text">Coming in a later step</p>' +
            '</section>';
        }

        function applyItemTwoColumnLayout(container) {
          if (!container || container.querySelector(".item-workspace")) {
            return;
          }

          const cards = Array.from(container.children).filter(function (el) {
            return el.classList && el.classList.contains("card");
          });
          if (cards.length === 0) return;

          const fieldsCard = cards.find(function (c) {
            return Boolean(c.querySelector(".fields-grid"));
          }) || null;
          const drawingCard = cards.find(function (c) {
            return Boolean(c.querySelector(".drawing-frame"));
          }) || null;
          const exportCard = cards.find(function (c) {
            return c.classList.contains("add-export-card");
          }) || null;

          const middleCards = cards.filter(function (c) {
            return c !== fieldsCard && c !== drawingCard && c !== exportCard;
          });

          const leftCards = [];
          if (fieldsCard) leftCards.push(fieldsCard);
          middleCards.forEach(function (c) {
            leftCards.push(c);
          });
          if (exportCard) leftCards.push(exportCard);

          const workspace = document.createElement("div");
          workspace.className = "item-workspace";

          const leftCol = document.createElement("div");
          leftCol.className = "item-col-left";

          leftCards.forEach(function (card, idx) {
            card.style.setProperty("--card-index", String(idx + 1));
            leftCol.appendChild(card);
          });

          workspace.appendChild(leftCol);

          if (drawingCard) {
            drawingCard.classList.add("item-drawing-card");
            drawingCard.style.setProperty("--card-index", "1");
            workspace.appendChild(drawingCard);
          }

          container.classList.add("is-item-layout");
          container.appendChild(workspace);
        }

        function renderRulesPage(selectedModuleId) {
          if (MODULES.length === 0) {
            pageRoot.classList.remove("is-item-layout");
            renderPlaceholderCard("Rules");
            return;
          }

          if (selectedModuleId) {
            const targetMod = MODULES.find(function (m) {
              return m.id === selectedModuleId;
            });
            if (targetMod && typeof targetMod.renderScreen === "function") {
              targetMod.renderScreen(pageRoot, function () {
                switchPage("rules");
              });
              applyItemTwoColumnLayout(pageRoot);
              return;
            }
          }

          pageRoot.classList.remove("is-item-layout");

          pageRoot.innerHTML =
            '<div class="rules-search-wrap card-stagger" style="--card-index: 0;">' +
              '<svg class="rules-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                '<circle cx="11" cy="11" r="7"></circle>' +
                '<path d="m20 20-4-4"></path>' +
              '</svg>' +
              '<input id="rules-search-input" type="search" class="rules-search-input" placeholder="Search an item: bolt, hose, nut..." aria-label="Search an item: bolt, hose, nut..." />' +
            '</div>' +
            '<div id="rules-tiles-grid" class="rules-grid"></div>';

          const searchInput = document.getElementById("rules-search-input");
          const tilesGrid = document.getElementById("rules-tiles-grid");

          function drawTiles(queryText) {
            const q = String(queryText || "").trim().toLowerCase();
            const filtered = MODULES.filter(function (mod) {
              if (!q) return true;
              if (mod.name.toLowerCase().indexOf(q) !== -1) return true;
              if (Array.isArray(mod.searchWords)) {
                return mod.searchWords.some(function (w) {
                  return String(w).toLowerCase().indexOf(q) !== -1;
                });
              }
              return false;
            });

            if (filtered.length === 0) {
              tilesGrid.innerHTML =
                '<section class="card" style="grid-column: 1 / -1;">' +
                  '<p class="placeholder-text">No item found</p>' +
                '</section>';
              return;
            }

            tilesGrid.innerHTML = filtered.map(function (mod, idx) {
              return (
                '<button type="button" class="rule-tile card-stagger" data-module-id="' + mod.id + '" style="--card-index: ' + (idx + 1) + ';">' +
                  '<div class="rule-tile-icon" style="background-color: ' + mod.tileBg + '; color: ' + mod.tileColor + ';">' +
                    mod.iconSvg +
                  '</div>' +
                  '<p class="rule-tile-name">' + mod.name + '</p>' +
                '</button>'
              );
            }).join("");

            tilesGrid.querySelectorAll(".rule-tile").forEach(function (tile) {
              tile.addEventListener("touchstart", function () {
                tile.classList.add("is-touched");
              }, { passive: true });
              tile.addEventListener("touchend", function () {
                setTimeout(function () {
                  tile.classList.remove("is-touched");
                }, 160);
              }, { passive: true });
              tile.addEventListener("touchcancel", function () {
                tile.classList.remove("is-touched");
              }, { passive: true });

              tile.addEventListener("click", function () {
                const modId = tile.getAttribute("data-module-id");
                openModuleScreen(modId);
              });
            });
          }

          searchInput.addEventListener("input", function () {
            drawTiles(searchInput.value);
          });

          drawTiles("");
        }

        function openModuleScreen(moduleId) {
          cancelCountAnimations();
          pageRoot.classList.remove("page-enter");
          void pageRoot.offsetWidth;
          renderRulesPage(moduleId);
          if (!prefersReducedMotion()) {
            pageRoot.classList.add("page-enter");
          }
          attachCardTouchLift(pageRoot);
        }

        function escHtml(text) {
          return String(text == null ? "" : text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        let exportEditingId = null;
        let exportUndoState = null;
        let exportUndoTimer = null;

        function removeExportUndoBar() {
          const existing = document.getElementById("export-undo-wrap");
          if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
          }
        }

        function clearExportUndo() {
          if (exportUndoTimer) {
            clearTimeout(exportUndoTimer);
            exportUndoTimer = null;
          }
          exportUndoState = null;
          removeExportUndoBar();
        }

        function applyExportUndo() {
          if (!exportUndoState) return;
          const snap = exportUndoState;
          clearExportUndo();
          if (snap.type === "remove") {
            const current = QSExport.getAll();
            const insertAt = Math.max(0, Math.min(snap.index, current.length));
            current.splice(insertAt, 0, snap.item);
            QSExport.restoreItems(current);
          } else if (snap.type === "clear") {
            QSExport.restoreItems(snap.items);
          }
          exportEditingId = null;
          if (currentPage === "export") {
            renderExportPage();
            attachCardTouchLift(pageRoot);
          }
        }

        function showExportUndo(nextState) {
          clearExportUndo();
          exportUndoState = nextState;

          const wrap = document.createElement("div");
          wrap.id = "export-undo-wrap";
          wrap.className = "export-undo-wrap";

          const bar = document.createElement("div");
          bar.id = "export-undo-bar";
          bar.className = "export-undo-bar";
          bar.setAttribute("role", "status");
          bar.setAttribute("aria-live", "polite");

          const msg = document.createElement("p");
          msg.className = "export-undo-text";
          msg.textContent = nextState.message;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.id = "export-undo-btn";
          btn.className = "export-undo-btn";
          btn.textContent = "Undo";
          btn.addEventListener("click", function () {
            applyExportUndo();
          });

          bar.appendChild(msg);
          bar.appendChild(btn);
          wrap.appendChild(bar);
          document.body.appendChild(wrap);

          exportUndoTimer = setTimeout(function () {
            clearExportUndo();
          }, 8000);
        }

        function renderExportPage(backupStatus) {
          const items = QSExport.getAll();
          const count = items.length;
          const countLabel = count + (count === 1 ? " item" : " items");

          if (exportEditingId && !items.some(function (it) { return it.id === exportEditingId; })) {
            exportEditingId = null;
          }

          const listHtml = count === 0
            ? '<section class="card card-stagger" style="--card-index: 1;">' +
                '<p class="placeholder-text">No items yet. Add one from a module.</p>' +
              '</section>'
            : '<div class="export-list">' +
                items.map(function (item, idx) {
                  if (exportEditingId === item.id) {
                    const initShort = String(item.shortName || "");
                    const initOver = initShort.length > 40;
                    return (
                      '<section class="card export-item-card is-editing card-stagger" data-row-id="' + escHtml(item.id) + '" style="--card-index: ' + (idx + 1) + ';">' +
                        '<div class="export-item-edit-form">' +
                          '<label class="export-edit-label" for="export-edit-short-input">Short text</label>' +
                          '<input type="text" id="export-edit-short-input" class="export-edit-short-input' + (initOver ? ' is-over' : '') + '" spellcheck="false" />' +
                          '<div class="export-edit-meta">' +
                            '<span id="export-edit-counter" class="char-counter' + (initOver ? ' is-over' : '') + '">' + initShort.length + ' / 40</span>' +
                            '<p id="export-edit-warn" class="export-edit-warn' + (initOver ? '' : ' is-hidden') + '">Short text is over 40 characters.</p>' +
                          '</div>' +
                          '<label class="export-edit-label" for="export-edit-long-input">Long text</label>' +
                          '<textarea id="export-edit-long-input" class="export-edit-long-input" rows="3"></textarea>' +
                          '<div class="export-edit-actions">' +
                            '<button type="button" class="btn-primary" id="export-edit-save-btn">Save</button>' +
                            '<button type="button" class="btn-secondary" id="export-edit-cancel-btn">Cancel</button>' +
                          '</div>' +
                        '</div>' +
                      '</section>'
                    );
                  }
                  return (
                    '<section class="card export-item-card card-stagger" data-row-id="' + escHtml(item.id) + '" style="--card-index: ' + (idx + 1) + ';">' +
                      '<div class="export-item-body">' +
                        '<p class="export-item-short">' + escHtml(item.shortName) + '</p>' +
                        '<p class="export-item-long">' + escHtml(item.longText) + '</p>' +
                      '</div>' +
                      '<div class="export-item-actions">' +
                        '<button type="button" class="export-edit-btn" data-edit-id="' + escHtml(item.id) + '" aria-label="Edit item">' +
                          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                            '<path d="M12 20h9"></path>' +
                            '<path d="M16.5 3.5a2.12 2.12 0 1 1 3 3L7 19l-4 1 1-4Z"></path>' +
                          '</svg>' +
                        '</button>' +
                        '<button type="button" class="export-delete-btn" data-delete-id="' + escHtml(item.id) + '" aria-label="Remove item">' +
                          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                            '<path d="M18 6L6 18"></path>' +
                            '<path d="M6 6l12 12"></path>' +
                          '</svg>' +
                        '</button>' +
                      '</div>' +
                    '</section>'
                  );
                }).join("") +
              '</div>';

          const statusClass = backupStatus && backupStatus.text
            ? (backupStatus.isError ? " is-error" : " is-success")
            : " is-hidden";
          const statusText = backupStatus && backupStatus.text ? escHtml(backupStatus.text) : "";

          pageRoot.innerHTML =
            '<section class="card card-stagger" style="--card-index: 0;">' +
              '<div class="export-top-row">' +
                '<h1 class="placeholder-title">Export</h1>' +
                '<span class="export-count-text" id="export-items-count">' + countLabel + '</span>' +
              '</div>' +
              '<div class="export-actions-row">' +
                '<button type="button" class="download-excel-btn" id="download-excel-btn"' + (count === 0 ? ' disabled' : '') + '>' +
                  'Download Excel' +
                '</button>' +
                (count > 0
                  ? '<button type="button" class="clear-all-btn" id="export-clear-btn">Clear all</button>'
                  : '') +
              '</div>' +
              '<div class="export-backup-row">' +
                '<button type="button" class="export-backup-btn" id="export-save-backup-btn">Save backup</button>' +
                '<button type="button" class="export-backup-btn" id="export-load-backup-btn">Load backup</button>' +
                '<input type="file" id="export-backup-file" class="export-backup-file-input" accept=".json,application/json" aria-label="Choose backup file" />' +
              '</div>' +
              '<p class="export-backup-status' + statusClass + '" id="export-backup-status" role="status" aria-live="polite">' + statusText + '</p>' +
              '<div class="backup-confirm-bar is-hidden" id="export-backup-confirm">' +
                '<p class="backup-confirm-text" id="export-backup-confirm-text"></p>' +
                '<div class="backup-confirm-actions">' +
                  '<button type="button" class="btn-primary" id="export-backup-replace-btn">Replace my list</button>' +
                  '<button type="button" class="btn-secondary" id="export-backup-add-btn">Add to my list</button>' +
                  '<button type="button" class="btn-secondary" id="export-backup-cancel-btn">Cancel</button>' +
                '</div>' +
              '</div>' +
              '<div class="clear-confirm-bar is-hidden" id="export-clear-confirm">' +
                '<p class="clear-confirm-text">Are you sure?</p>' +
                '<div class="clear-confirm-actions">' +
                  '<button type="button" class="btn-secondary" id="export-clear-cancel">Cancel</button>' +
                  '<button type="button" class="btn-danger" id="export-clear-yes">Yes, clear all</button>' +
                '</div>' +
              '</div>' +
            '</section>' +
            listHtml;

          const downloadBtn = document.getElementById("download-excel-btn");
          if (downloadBtn) {
            downloadBtn.addEventListener("click", function () {
              QSExport.downloadExcel();
            });
          }

          const saveBackupBtn = document.getElementById("export-save-backup-btn");
          const loadBackupBtn = document.getElementById("export-load-backup-btn");
          const backupFileInput = document.getElementById("export-backup-file");
          const backupStatusEl = document.getElementById("export-backup-status");
          const backupConfirmEl = document.getElementById("export-backup-confirm");
          const backupConfirmTextEl = document.getElementById("export-backup-confirm-text");
          const backupReplaceBtn = document.getElementById("export-backup-replace-btn");
          const backupAddBtn = document.getElementById("export-backup-add-btn");
          const backupCancelBtn = document.getElementById("export-backup-cancel-btn");
          let pendingBackupRows = null;

          function showBackupStatus(text, isError) {
            if (!backupStatusEl) return;
            backupStatusEl.textContent = text;
            backupStatusEl.classList.remove("is-hidden", "is-error", "is-success");
            backupStatusEl.classList.add(isError ? "is-error" : "is-success");
          }

          function hideBackupConfirm() {
            pendingBackupRows = null;
            if (backupConfirmEl) {
              backupConfirmEl.classList.add("is-hidden");
            }
          }

          if (saveBackupBtn) {
            saveBackupBtn.addEventListener("click", function () {
              hideBackupConfirm();
              const res = QSExport.downloadBackup();
              if (!res.saved) {
                showBackupStatus("Export list is empty, nothing to save.", true);
                return;
              }
              showBackupStatus(
                "Saved backup (" + res.rowCount + (res.rowCount === 1 ? " row" : " rows") + ").",
                false
              );
            });
          }

          if (loadBackupBtn && backupFileInput) {
            loadBackupBtn.addEventListener("click", function () {
              hideBackupConfirm();
              backupFileInput.value = "";
              backupFileInput.click();
            });

            backupFileInput.addEventListener("change", function () {
              const file = backupFileInput.files && backupFileInput.files[0];
              if (!file) return;

              const reader = new FileReader();
              reader.onload = function () {
                const parsed = QSExport.parseBackupText(reader.result);
                if (!parsed.valid) {
                  hideBackupConfirm();
                  showBackupStatus("This is not a valid backup file.", true);
                  return;
                }
                pendingBackupRows = parsed.rows;
                if (backupStatusEl) {
                  backupStatusEl.textContent = "";
                  backupStatusEl.classList.add("is-hidden");
                  backupStatusEl.classList.remove("is-error", "is-success");
                }
                if (backupConfirmTextEl) {
                  const n = pendingBackupRows.length;
                  backupConfirmTextEl.textContent =
                    "Backup has " + n + (n === 1 ? " row" : " rows") + ". Load into export list?";
                }
                if (backupConfirmEl) {
                  backupConfirmEl.classList.remove("is-hidden");
                }
              };
              reader.onerror = function () {
                hideBackupConfirm();
                showBackupStatus("This is not a valid backup file.", true);
              };
              reader.readAsText(file);
            });
          }

          if (backupReplaceBtn) {
            backupReplaceBtn.addEventListener("click", function () {
              if (!pendingBackupRows) return;
              const rowsToLoad = pendingBackupRows.slice();
              pendingBackupRows = null;
              clearExportUndo();
              exportEditingId = null;
              const res = QSExport.replaceFromBackup(rowsToLoad);
              const msg = "Loaded " + res.loaded + (res.loaded === 1 ? " row." : " rows.");
              renderExportPage({ text: msg, isError: false });
              attachCardTouchLift(pageRoot);
            });
          }

          if (backupAddBtn) {
            backupAddBtn.addEventListener("click", function () {
              if (!pendingBackupRows) return;
              const rowsToLoad = pendingBackupRows.slice();
              pendingBackupRows = null;
              clearExportUndo();
              exportEditingId = null;
              const res = QSExport.addFromBackup(rowsToLoad);
              const msg =
                "Loaded " + res.loaded + (res.loaded === 1 ? " row. " : " rows. ") +
                res.skipped + " skipped (already in list).";
              renderExportPage({ text: msg, isError: false });
              attachCardTouchLift(pageRoot);
            });
          }

          if (backupCancelBtn) {
            backupCancelBtn.addEventListener("click", function () {
              hideBackupConfirm();
            });
          }

          const clearBtn = document.getElementById("export-clear-btn");
          const clearConfirm = document.getElementById("export-clear-confirm");
          const clearCancel = document.getElementById("export-clear-cancel");
          const clearYes = document.getElementById("export-clear-yes");

          if (clearBtn && clearConfirm) {
            clearBtn.addEventListener("click", function () {
              clearConfirm.classList.remove("is-hidden");
            });
          }
          if (clearCancel && clearConfirm) {
            clearCancel.addEventListener("click", function () {
              clearConfirm.classList.add("is-hidden");
            });
          }
          if (clearYes) {
            clearYes.addEventListener("click", function () {
              const snapshot = items.map(function (it) { return Object.assign({}, it); });
              exportEditingId = null;
              QSExport.clear();
              renderExportPage();
              attachCardTouchLift(pageRoot);
              if (snapshot.length > 0) {
                showExportUndo({
                  type: "clear",
                  message: "All items cleared.",
                  items: snapshot
                });
              }
            });
          }

          if (exportEditingId) {
            const editingItem = items.find(function (it) { return it.id === exportEditingId; });
            const shortInput = document.getElementById("export-edit-short-input");
            const longInput = document.getElementById("export-edit-long-input");
            const counterEl = document.getElementById("export-edit-counter");
            const warnEl = document.getElementById("export-edit-warn");
            const saveEditBtn = document.getElementById("export-edit-save-btn");
            const cancelEditBtn = document.getElementById("export-edit-cancel-btn");

            function updateEditCounter() {
              if (!shortInput || !counterEl) return;
              const len = shortInput.value.length;
              const isOver = len > 40;
              counterEl.textContent = len + " / 40";
              counterEl.classList.toggle("is-over", isOver);
              shortInput.classList.toggle("is-over", isOver);
              if (warnEl) {
                warnEl.classList.toggle("is-hidden", !isOver);
              }
            }

            if (editingItem && shortInput && longInput) {
              shortInput.value = String(editingItem.shortName || "");
              longInput.value = String(editingItem.longText || "");
              updateEditCounter();
              shortInput.addEventListener("input", updateEditCounter);
            }

            if (saveEditBtn && shortInput && longInput) {
              saveEditBtn.addEventListener("click", function () {
                updateEditCounter();
                if (shortInput.value.length > 40) {
                  shortInput.focus();
                  return;
                }
                const targetId = exportEditingId;
                exportEditingId = null;
                QSExport.updateRow(targetId, shortInput.value, longInput.value);
                renderExportPage();
                attachCardTouchLift(pageRoot);
              });
            }

            if (cancelEditBtn) {
              cancelEditBtn.addEventListener("click", function () {
                exportEditingId = null;
                renderExportPage();
                attachCardTouchLift(pageRoot);
              });
            }
          }

          pageRoot.querySelectorAll(".export-edit-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
              const id = btn.getAttribute("data-edit-id");
              if (id) {
                exportEditingId = id;
                renderExportPage();
                attachCardTouchLift(pageRoot);
                const focusBox = document.getElementById("export-edit-short-input");
                if (focusBox) focusBox.focus();
              }
            });
          });

          pageRoot.querySelectorAll(".export-delete-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
              const id = btn.getAttribute("data-delete-id");
              if (id) {
                const idx = items.findIndex(function (it) { return it.id === id; });
                const removedItem = idx !== -1 ? Object.assign({}, items[idx]) : null;
                if (exportEditingId === id) {
                  exportEditingId = null;
                }
                QSExport.remove(id);
                renderExportPage();
                attachCardTouchLift(pageRoot);
                if (removedItem) {
                  showExportUndo({
                    type: "remove",
                    message: "Item removed.",
                    item: removedItem,
                    index: idx
                  });
                }
              }
            });
          });
        }

        function renderExistingPage(viewState) {
          const st = QSExisting.state;
          const view = viewState || { mode: "overview", kindId: "", filter: "all", search: "", limit: 50, rowIndex: -1 };

          function triggerExistingTransition(nextView) {
            pageRoot.classList.remove("page-enter");
            void pageRoot.offsetWidth;
            renderExistingPage(nextView);
            if (!prefersReducedMotion()) {
              pageRoot.classList.add("page-enter");
            }
            attachCardTouchLift(pageRoot);
          }

          /* ----- MODE 3: SINGLE ITEM REVIEW SCREEN ----- */
          if (view.mode === "review") {
            const item = st.items[view.rowIndex];
            if (!item) {
