<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QS Material Planner</title>
    <meta name="description" content="Offline-first SAP material short and long text planner dashboard." />
    <meta property="og:title" content="QS Material Planner" />
    <meta property="og:description" content="Offline-first SAP material short and long text planner dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- =========================================================
         STYLE CODE
         Colors, layout, cards, charts, and motion rules
         ========================================================= -->
    <style>
      :root {
        --dark-green: #0D3A2F;
        --dark-green-hover: #144D3F;
        --sidebar-bg: #0D3A2F;
        --mint-accent: #6FE3BA;
        --mint-soft: #D6F6E9;
        --mint-tint: #EFF9F5;
        --icon-muted: #9ADEC6;
        --page-bg: #F1F8F5;
        --card-bg: #FFFFFF;
        --card-border: rgba(13, 58, 47, 0.06);
        --input-border: #D5E6DF;
        --text-main: #0E2B23;
        --text-muted: #647871;
        --warn-orange: #D97706;
        --warn-orange-bg: #FFF7ED;
        --warn-red: #DC2626;
        --warn-red-bg: #FEF2F2;
        --warn-red-border: #FECACA;
        --card-shadow: 0 6px 24px -4px rgba(13, 58, 47, 0.07), 0 2px 6px rgba(13, 58, 47, 0.03);
        --card-shadow-lift: 0 16px 32px -6px rgba(13, 58, 47, 0.12), 0 4px 12px rgba(13, 58, 47, 0.05);
        --sidebar-width: 56px;
        --ease-out-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--page-bg);
        color: var(--text-main);
        font-family: "Plus Jakarta Sans", "Avenir Next", "SF Pro Display", "Segoe UI Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }

      /* Left Vertical Sidebar */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--sidebar-width);
        background-color: var(--sidebar-bg);
        box-shadow: 4px 0 24px rgba(13, 58, 47, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: max(16px, env(safe-area-inset-top)) 0 max(16px, env(safe-area-inset-bottom)) 0;
        z-index: 40;
      }

      .logo-box {
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background-color: var(--mint-accent);
        color: var(--dark-green);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.03em;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        user-select: none;
        flex-shrink: 0;
      }

      .nav-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .nav-item {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .nav-btn {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        border: none;
        background: transparent;
        color: var(--icon-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        touch-action: manipulation;
        transition: background-color 0.2s var(--ease-out-smooth),
                    color 0.2s var(--ease-out-smooth),
                    transform 0.14s var(--ease-out-smooth);
      }

      .nav-btn:focus-visible {
        outline: 2px solid var(--mint-accent);
        outline-offset: 2px;
      }

      .nav-btn:active {
        transform: scale(0.93);
      }

      @media (hover: hover) {
        .nav-btn:not(.is-active):hover {
          background-color: rgba(111, 227, 186, 0.14);
          color: #FFFFFF;
        }
      }

      .nav-btn.is-active {
        background-color: var(--mint-accent);
        color: var(--dark-green);
      }

      .nav-btn svg {
        width: 20px;
        height: 20px;
        display: block;
      }

      /* Slide-out dark label to the right of sidebar icon */
      .nav-label {
        position: absolute;
        left: 62px;
        top: 50%;
        transform: translateY(-50%) translateX(-8px);
        background-color: var(--dark-green);
        color: #FFFFFF;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        padding: 7px 12px;
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(13, 58, 47, 0.22);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s var(--ease-out-smooth),
                    transform 0.22s var(--ease-out-smooth);
        z-index: 50;
      }

      .nav-item.show-label .nav-label,
      .nav-btn:focus-visible + .nav-label {
        opacity: 1;
        transform: translateY(-50%) translateX(0);
      }

      @media (hover: hover) {
        .nav-item:hover .nav-label {
          opacity: 1;
          transform: translateY(-50%) translateX(0);
        }
      }

      /* Main Content Area */
      .main-area {
        margin-left: var(--sidebar-width);
        min-height: 100dvh;
        min-width: 0;
        padding: 20px 16px max(36px, env(safe-area-inset-bottom)) 16px;
        display: flex;
        justify-content: center;
      }

      .page-container {
        width: 100%;
        min-width: 0;
        max-width: 820px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* Page Entrance Animation */
      @keyframes pageSlideUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .page-enter {
        animation: pageSlideUp 0.45s var(--ease-out-smooth) both;
      }

      /* Card Appearance & Lift */
      @keyframes cardAppear {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 20px;
        min-width: 0;
        color: var(--text-main);
        box-shadow: var(--card-shadow);
        touch-action: manipulation;
        transition: transform 0.2s var(--ease-out-smooth),
                    box-shadow 0.2s var(--ease-out-smooth);
      }

      .card-stagger {
        animation: cardAppear 0.48s var(--ease-out-smooth) both;
        animation-delay: calc(var(--card-index, 0) * 70ms);
      }

      .card:active,
      .card.is-touched {
        transform: translateY(-2px);
        box-shadow: var(--card-shadow-lift);
      }

      @media (hover: hover) {
        .card:hover {
          transform: translateY(-4px);
          box-shadow: var(--card-shadow-lift);
        }
      }

      /* Welcome Card */
      .welcome-card {
        background: linear-gradient(145deg, #0F4437 0%, #0A2E25 100%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 14px 32px -8px rgba(13, 58, 47, 0.25);
        color: #FFFFFF;
        padding: 26px 22px;
      }

      .welcome-title {
        margin: 0 0 8px 0;
        font-size: clamp(1.7rem, 5.5vw, 2.25rem);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }

      .welcome-title .faster-word {
        font-style: italic;
        color: var(--mint-accent);
      }

      .welcome-subtitle {
        margin: 0 0 20px 0;
        font-size: 15px;
        color: #CBEBE0;
      }

      .primary-orange-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 11px 24px;
        border-radius: 14px;
        border: none;
        background-color: var(--mint-accent);
        color: var(--dark-green);
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        box-shadow: 0 4px 14px rgba(111, 227, 186, 0.28);
        transition: transform 0.14s var(--ease-out-smooth),
                    background-color 0.18s var(--ease-out-smooth),
                    box-shadow 0.18s var(--ease-out-smooth);
      }

      .primary-orange-btn:active {
        transform: translateY(1px) scale(0.975);
      }

      .primary-orange-btn:focus-visible {
        outline: 2px solid #FFFFFF;
        outline-offset: 2px;
      }

      @media (hover: hover) {
        .primary-orange-btn:hover {
          background-color: #84EAC6;
          box-shadow: 0 6px 18px rgba(111, 227, 186, 0.36);
        }
      }

      /* Two Side-by-Side Stat Cards */
      .stats-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .stat-card {
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .card-label {
        margin: 0 0 10px 0;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.01em;
      }

      .stat-value {
        margin: 0;
        font-size: clamp(1.65rem, 6vw, 2.15rem);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--text-main);
      }

      .demo-caption {
        margin: 8px 0 0 0;
        font-size: 12px;
        color: var(--text-muted);
      }

      /* Progress Card */
      .progress-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .progress-header .card-label {
        margin: 0;
      }

      .progress-numbers {
        font-size: 15px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--dark-green);
      }

      .progress-track {
        width: 100%;
        height: 12px;
        background-color: var(--mint-tint);
        border-radius: 9999px;
        overflow: hidden;
      }

      .progress-fill {
        width: 18%;
        height: 100%;
        background-color: var(--dark-green);
        border-radius: 9999px;
        transform-origin: left center;
        transform: scaleX(0);
        transition: transform 0.85s var(--ease-out-smooth);
      }

      .progress-fill.is-grown {
        transform: scaleX(1);
      }

      .progress-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
      }

      .progress-percent {
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--dark-green);
      }

      /* Weekly Bar Chart Card */
      .chart-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 18px;
      }

      .chart-header .card-label {
        margin: 0;
      }

      .chart-header .demo-caption {
        margin: 0;
      }

      .bars-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 10px;
        align-items: end;
      }

      .bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .bar-track {
        width: 100%;
        max-width: 30px;
        height: 112px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .bar-fill {
        width: 100%;
        border-radius: 10px 10px 4px 4px;
        background-color: var(--mint-accent);
        transform-origin: bottom center;
        transform: scaleY(0);
        transition: transform 0.7s var(--ease-out-smooth);
      }

      .bar-fill.is-tallest {
        background-color: var(--dark-green);
      }

      .bar-fill.is-grown {
        transform: scaleY(1);
      }

      .bar-day {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
      }

      /* Page Titles & Subtitles */
      .placeholder-title {
        margin: 0 0 8px 0;
        font-size: clamp(1.55rem, 5vw, 2rem);
        font-weight: 800;
        line-height: 1.18;
        letter-spacing: -0.025em;
        color: var(--text-main);
        text-wrap: balance;
      }

      .placeholder-text {
        margin: 0;
        font-size: 14px;
        color: var(--text-muted);
      }

      /* Rules Page (Search + Tile Grid) */
      .rules-search-wrap {
        position: relative;
        width: 100%;
      }

      .rules-search-input {
        width: 100%;
        min-height: 50px;
        padding: 12px 16px 12px 44px;
        border: 1px solid var(--input-border);
        border-radius: 16px;
        background-color: var(--card-bg);
        color: var(--text-main);
        font-family: inherit;
        font-size: 16px;
        font-weight: 500;
        box-shadow: var(--card-shadow);
        outline: none;
        transition: border-color 0.18s var(--ease-out-smooth),
                    box-shadow 0.18s var(--ease-out-smooth);
      }

      .rules-search-input::placeholder {
        color: var(--text-muted);
      }

      .rules-search-input:focus {
        border-color: var(--dark-green);
        box-shadow: 0 0 0 3px rgba(111, 227, 186, 0.35);
      }

      .rules-search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        color: var(--text-muted);
        pointer-events: none;
      }

      .rules-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      @media (min-width: 640px) {
        .rules-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      .rule-tile {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
        padding: 20px;
        border-radius: 20px;
        border: 1px solid var(--card-border);
        background-color: var(--card-bg);
        color: var(--text-main);
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        box-shadow: var(--card-shadow);
        touch-action: manipulation;
        transition: transform 0.2s var(--ease-out-smooth),
                    box-shadow 0.2s var(--ease-out-smooth);
      }

      .rule-tile:active,
      .rule-tile.is-touched {
        transform: translateY(-2px) scale(0.985);
        box-shadow: var(--card-shadow-lift);
      }

      @media (hover: hover) {
        .rule-tile:hover {
          transform: translateY(-4px);
          box-shadow: var(--card-shadow-lift);
        }
      }

      .rule-tile-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .rule-tile-icon svg {
        width: 24px;
        height: 24px;
      }

      .rule-tile-name {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        color: var(--text-main);
      }

      /* Item Screen Header */
      .item-header {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        min-width: 0;
      }

      .back-btn {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        border: 1px solid var(--input-border);
        background-color: var(--card-bg);
        color: var(--text-main);
        box-shadow: 0 2px 10px rgba(13, 58, 47, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        touch-action: manipulation;
        transition: transform 0.14s var(--ease-out-smooth),
                    background-color 0.18s var(--ease-out-smooth),
                    box-shadow 0.18s var(--ease-out-smooth);
      }

      .back-btn:active {
        transform: scale(0.94);
      }

      @media (hover: hover) {
        .back-btn:hover {
          background-color: var(--mint-tint);
        }
      }

      .back-btn svg {
        width: 20px;
        height: 20px;
      }

      .item-screen-title {
        margin: 0;
        font-size: clamp(1.45rem, 4.8vw, 1.9rem);
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: -0.025em;
        color: var(--text-main);
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }

      /* Short & Long Name Boxes & Controls */
      .name-card {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .name-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }

      .name-card-title {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.01em;
      }

      .name-textarea {
        width: 100%;
        min-height: 92px;
        padding: 16px 18px;
        border: 1px solid var(--input-border);
        border-radius: 14px;
        background-color: var(--mint-tint);
        color: var(--text-main);
        font-family: inherit;
        font-size: clamp(18px, 4.4vw, 22px);
        font-weight: 700;
        line-height: 1.38;
        letter-spacing: 0.015em;
        resize: vertical;
        outline: none;
        transition: border-color 0.18s var(--ease-out-smooth),
                    background-color 0.18s var(--ease-out-smooth),
                    box-shadow 0.18s var(--ease-out-smooth),
                    color 0.18s var(--ease-out-smooth);
      }

      .name-textarea::placeholder {
        font-size: 15px;
        font-weight: 600;
        color: #849B93;
        letter-spacing: 0.01em;
      }

      .name-textarea:focus {
        border-color: var(--dark-green);
        background-color: #FFFFFF;
        box-shadow: 0 0 0 3px rgba(111, 227, 186, 0.35);
      }

      .name-textarea.is-over {
        border-color: var(--warn-red);
        background-color: var(--warn-red-bg);
        color: #991B1B;
      }

      .name-textarea.is-over:focus {
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.18);
      }

      .long-textarea {
        min-height: 98px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.55;
        letter-spacing: normal;
      }

      /* Live Drawing Box */
      .drawing-frame {
        width: 100%;
        background-color: #FFFFFF;
        border: 1px solid var(--input-border);
        border-radius: 14px;
        padding: 8px;
        overflow: hidden;
      }

      .drawing-frame svg {
        width: 100%;
        height: auto;
        display: block;
      }

      @keyframes boltShapeSwap {
        from {
          opacity: 0.45;
          transform: scale(0.975);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .bolt-shape-animate,
      .head-view-animate {
        transform-box: fill-box;
        transform-origin: center;
        animation: boltShapeSwap 0.26s var(--ease-out-smooth) both;
      }

      .name-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }

      .char-counter {
        font-size: 13px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: #0E7459;
        transition: color 0.22s var(--ease-out-smooth);
      }

      .char-counter.is-near {
        color: var(--warn-orange);
      }

      .char-counter.is-over {
        color: var(--warn-red);
      }

      .missing-note {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--warn-red);
      }

      .missing-note.is-hidden {
        display: none;
      }

      .name-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-secondary {
        min-height: 40px;
        padding: 8px 16px;
        border-radius: 12px;
        border: 1px solid var(--input-border);
        background-color: var(--mint-tint);
        color: var(--dark-green);
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.14s var(--ease-out-smooth),
                    background-color 0.18s var(--ease-out-smooth),
                    border-color 0.18s var(--ease-out-smooth);
      }

      .btn-primary {
        min-height: 40px;
        padding: 8px 18px;
        border-radius: 12px;
        border: none;
        background-color: var(--dark-green);
        color: #FFFFFF;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.14s var(--ease-out-smooth),
                    background-color 0.18s var(--ease-out-smooth),
                    box-shadow 0.18s var(--ease-out-smooth);
      }

      @media (hover: hover) {
        .btn-secondary:hover {
          background-color: var(--mint-soft);
        }
        .btn-primary:hover {
          background-color: var(--dark-green-hover);
        }
      }

      .btn-secondary:active,
      .btn-primary:active {
        transform: translateY(1px) scale(0.97);
      }

      /* Fields Form */
      .fields-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
      }

      @media (min-width: 640px) {
        .fields-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 18px 20px;
        }
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 0;
      }

      .field-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .field-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.01em;
      }

      .field-tag {

    <!-- =========================================================
         OFFLINE EXCEL & EXPORT LIST STORE
         Saved on phone (localStorage with safe fallback)
         and built-in offline .xlsx file generator (no internet)
         ========================================================= -->
    <script>
      const QSExport = (function () {
        const STORAGE_KEY = "qs_material_export_list_v1";
        let memoryFallback = [];

        const EXCEL_FIXED_VALUES = {
          material: "Sys Generated Number",
          plant: "QSK",
          profitCenter: "QSO",
          storageLocation1: "MS01"
        };

        const EXCEL_COLUMNS = [
          { header: "S.No", width: 8 },
          { header: "Material Description (Max 40 Char)", width: 42 },
          { header: "Long Text", width: 60 },
          { header: "LEN", width: 8 },
          { header: "Material", width: 24 },
          { header: "Material Type", width: 15 },
          { header: "Base Unit of Measure", width: 22 },
          { header: "Material Group", width: 18 },
          { header: "Plant", width: 10 },
          { header: "Profit Center", width: 15 },
          { header: "Storage Location-1", width: 20 }
        ];

        function loadList() {
          try {
            const raw = window.localStorage.getItem(STORAGE_KEY);
            if (!raw) return memoryFallback.slice();
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              memoryFallback = parsed;
              return parsed.slice();
            }
          } catch (err) {
            /* Safe fallback when localStorage is blocked */
          }
          return memoryFallback.slice();
        }

        function saveList(items) {
          memoryFallback = items.slice();
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(memoryFallback));
          } catch (err) {
            /* Safe fallback when localStorage is blocked */
          }
        }

        function add(entry) {
          const items = loadList();
          const item = Object.assign({
            id: "item_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
            addedAt: new Date().toISOString()
          }, entry);
          items.push(item);
          saveList(items);
          return items.length;
        }

        function remove(id) {
          const items = loadList().filter(function (item) {
            return item.id !== id;
          });
          saveList(items);
          return items;
        }

        function clear() {
          saveList([]);
          return [];
        }

        function count() {
          return loadList().length;
        }

        function utf8Encode(str) {
          if (typeof TextEncoder !== "undefined") {
            return new TextEncoder().encode(str);
          }
          const bytes = [];
          for (let i = 0; i < str.length; i++) {
            let code = str.charCodeAt(i);
            if (code < 0x80) {
              bytes.push(code);
            } else if (code < 0x800) {
              bytes.push(0xC0 | (code >> 6), 0x80 | (code & 0x3F));
            } else if (code >= 0xD800 && code <= 0xDBFF && i + 1 < str.length) {
              const next = str.charCodeAt(++i);
              const cp = 0x10000 + (((code - 0xD800) << 10) | (next - 0xDC00));
              bytes.push(
                0xF0 | (cp >> 18),
                0x80 | ((cp >> 12) & 0x3F),
                0x80 | ((cp >> 6) & 0x3F),
                0x80 | (cp & 0x3F)
              );
            } else {
              bytes.push(0xE0 | (code >> 12), 0x80 | ((code >> 6) & 0x3F), 0x80 | (code & 0x3F));
            }
          }
          return new Uint8Array(bytes);
        }

        const CRC_TABLE = (function () {
          const table = new Uint32Array(256);
          for (let i = 0; i < 256; i++) {
            let c = i;
            for (let k = 0; k < 8; k++) {
              c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
            }
            table[i] = c >>> 0;
          }
          return table;
        })();

        function crc32(bytes) {
          let crc = 0xFFFFFFFF;
          for (let i = 0; i < bytes.length; i++) {
            crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
          }
          return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        function escXml(value) {
          return String(value == null ? "" : value)
            .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&apos;");
        }

        function colLetter(zeroIndex) {
          let n = zeroIndex;
          let s = "";
          while (n >= 0) {
            s = String.fromCharCode((n % 26) + 65) + s;
            n = Math.floor(n / 26) - 1;
          }
          return s;
        }

        function makeTextCell(ref, text, styleIndex) {
          const sAttr = styleIndex ? (' s="' + styleIndex + '"') : "";
          return '<c r="' + ref + '"' + sAttr + ' t="inlineStr"><is><t xml:space="preserve">' + escXml(text) + '</t></is></c>';
        }

        function makeNumberCell(ref, num, styleIndex) {
          const sAttr = styleIndex ? (' s="' + styleIndex + '"') : "";
          return '<c r="' + ref + '"' + sAttr + '><v>' + Number(num) + '</v></c>';
        }

        function buildSheetXml(items) {
          const colsXml = EXCEL_COLUMNS.map(function (col, idx) {
            const c = idx + 1;
            return '<col min="' + c + '" max="' + c + '" width="' + col.width + '" customWidth="1"/>';
          }).join("");

          const headerCells = EXCEL_COLUMNS.map(function (col, idx) {
            return makeTextCell(colLetter(idx) + "1", col.header, 1);
          }).join("");

          const rowsXml = ['<row r="1" ht="24" customHeight="1">' + headerCells + '</row>'];

          items.forEach(function (item, idx) {
            const r = idx + 2;
            const shortName = String(item.shortName || "");
            const longText = String(item.longText || "");
            const defaults = item.sapDefaults || {};
            const matType = defaults.materialType || "";
            const baseUnit = defaults.baseUnit || "";
            const matGroup = defaults.materialGroup || "";

            const rowCells = [
              makeNumberCell("A" + r, idx + 1, 0),
              makeTextCell("B" + r, shortName, 0),
              makeTextCell("C" + r, longText, 2),
              makeNumberCell("D" + r, shortName.length, 0),
              makeTextCell("E" + r, EXCEL_FIXED_VALUES.material, 0),
              makeTextCell("F" + r, matType, 0),
              makeTextCell("G" + r, baseUnit, 0),
              makeTextCell("H" + r, matGroup, 0),
              makeTextCell("I" + r, EXCEL_FIXED_VALUES.plant, 0),
              makeTextCell("J" + r, EXCEL_FIXED_VALUES.profitCenter, 0),
              makeTextCell("K" + r, EXCEL_FIXED_VALUES.storageLocation1, 0)
            ].join("");

            rowsXml.push('<row r="' + r + '">' + rowCells + '</row>');
          });

          const lastRow = Math.max(1, items.length + 1);
          const lastCol = colLetter(EXCEL_COLUMNS.length - 1);

          return (
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
              '<dimension ref="A1:' + lastCol + lastRow + '"/>' +
              '<sheetViews><sheetView workbookViewId="0"/></sheetViews>' +
              '<sheetFormatPr defaultRowHeight="18"/>' +
              '<cols>' + colsXml + '</cols>' +
              '<sheetData>' + rowsXml.join("") + '</sheetData>' +
            '</worksheet>'
          );
        }

        function buildZip(entries) {
          const localParts = [];
          const centralParts = [];
          let offset = 0;

          const now = new Date();
          const dosTime = ((now.getHours() & 0x1F) << 11) | ((now.getMinutes() & 0x3F) << 5) | ((now.getSeconds() >> 1) & 0x1F);
          const dosDate = (((Math.max(1980, now.getFullYear()) - 1980) & 0x7F) << 9) | (((now.getMonth() + 1) & 0x0F) << 5) | (now.getDate() & 0x1F);

          entries.forEach(function (entry) {
            const nameBytes = utf8Encode(entry.name);
            const dataBytes = utf8Encode(entry.content);
            const crc = crc32(dataBytes);
            const size = dataBytes.length;

            const localHeader = new Uint8Array(30 + nameBytes.length);
            const lv = new DataView(localHeader.buffer);
            lv.setUint32(0, 0x04034B50, true);
            lv.setUint16(4, 20, true);
            lv.setUint16(6, 0x0800, true);
            lv.setUint16(8, 0, true);
            lv.setUint16(10, dosTime, true);
            lv.setUint16(12, dosDate, true);
            lv.setUint32(14, crc, true);
            lv.setUint32(18, size, true);
            lv.setUint32(22, size, true);
            lv.setUint16(26, nameBytes.length, true);
            lv.setUint16(28, 0, true);
            localHeader.set(nameBytes, 30);

            localParts.push(localHeader, dataBytes);

            const centralHeader = new Uint8Array(46 + nameBytes.length);
            const cv = new DataView(centralHeader.buffer);
            cv.setUint32(0, 0x02014B50, true);
            cv.setUint16(4, 20, true);
            cv.setUint16(6, 20, true);
            cv.setUint16(8, 0x0800, true);
            cv.setUint16(10, 0, true);
            cv.setUint16(12, dosTime, true);
            cv.setUint16(14, dosDate, true);
            cv.setUint32(16, crc, true);
            cv.setUint32(20, size, true);
            cv.setUint32(24, size, true);
            cv.setUint16(28, nameBytes.length, true);
            cv.setUint16(30, 0, true);
            cv.setUint16(32, 0, true);
            cv.setUint16(34, 0, true);
            cv.setUint16(36, 0, true);
            cv.setUint32(38, 0, true);
            cv.setUint32(42, offset, true);
            centralHeader.set(nameBytes, 46);

            centralParts.push(centralHeader);
            offset += localHeader.length + dataBytes.length;
          });

          const centralSize = centralParts.reduce(function (sum, arr) { return sum + arr.length; }, 0);
          const eocd = new Uint8Array(22);
          const ev = new DataView(eocd.buffer);
          ev.setUint32(0, 0x06054B50, true);
          ev.setUint16(4, 0, true);
          ev.setUint16(6, 0, true);
          ev.setUint16(8, entries.length, true);
          ev.setUint16(10, entries.length, true);
          ev.setUint32(12, centralSize, true);
          ev.setUint32(16, offset, true);
          ev.setUint16(20, 0, true);

          const totalLength = offset + centralSize + eocd.length;
          const out = new Uint8Array(totalLength);
          let pos = 0;
          localParts.forEach(function (part) { out.set(part, pos); pos += part.length; });
          centralParts.forEach(function (part) { out.set(part, pos); pos += part.length; });
          out.set(eocd, pos);
          return out;
        }

        function createXlsxBytes(items) {
          const contentTypesXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
              '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
              '<Default Extension="xml" ContentType="application/xml"/>' +
              '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
              '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
              '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
            '</Types>';

          const rootRelsXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
              '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
            '</Relationships>';

          const workbookXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
              '<sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets>' +
            '</workbook>';

          const workbookRelsXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
              '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
              '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
            '</Relationships>';

          const stylesXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
              '<fonts count="2">' +
                '<font><sz val="11"/><name val="Calibri"/></font>' +
                '<font><b/><sz val="11"/><color rgb="FF10302A"/><name val="Calibri"/></font>' +
              '</fonts>' +
              '<fills count="3">' +
                '<fill><patternFill patternType="none"/></fill>' +
                '<fill><patternFill patternType="gray125"/></fill>' +
                '<fill><patternFill patternType="solid"><fgColor rgb="FFE6F3EC"/><bgColor indexed="64"/></patternFill></fill>' +
              '</fills>' +
              '<borders count="1">' +
                '<border><left/><right/><top/><bottom/><diagonal/></border>' +
              '</borders>' +
              '<cellStyleXfs count="1">' +
                '<xf numFmtId="0" fontId="0" fillId="0" borderId="0"/>' +
              '</cellStyleXfs>' +
              '<cellXfs count="3">' +
                '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top"/></xf>' +
                '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
                '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
              '</cellXfs>' +
            '</styleSheet>';

          const sheetXml = buildSheetXml(items);

          return buildZip([
            { name: "[Content_Types].xml", content: contentTypesXml },
            { name: "_rels/.rels", content: rootRelsXml },
            { name: "xl/workbook.xml", content: workbookXml },
            { name: "xl/_rels/workbook.xml.rels", content: workbookRelsXml },
            { name: "xl/styles.xml", content: stylesXml },
            { name: "xl/worksheets/sheet1.xml", content: sheetXml }
          ]);
        }

        function getFilename(dateObj) {
          const d = dateObj || new Date();
          const yyyy = String(d.getFullYear());
          const mm = String(d.getMonth() + 1).padStart(2, "0");
          const dd = String(d.getDate()).padStart(2, "0");
          return "Material_Export_" + yyyy + mm + dd + ".xlsx";
        }

        function createTableXlsxBytes(columns, rows, sheetName) {
          const colsXml = columns.map(function (col, idx) {
            const c = idx + 1;
            const w = col.width || 22;
            return '<col min="' + c + '" max="' + c + '" width="' + w + '" customWidth="1"/>';
          }).join("");

          const headerCells = columns.map(function (col, idx) {
            return makeTextCell(colLetter(idx) + "1", col.header, 1);
          }).join("");

          const rowsXml = ['<row r="1" ht="24" customHeight="1">' + headerCells + '</row>'];

          rows.forEach(function (rowArr, rIdx) {
            const r = rIdx + 2;
            const cells = columns.map(function (col, cIdx) {
              const val = (rowArr && rowArr[cIdx] != null) ? rowArr[cIdx] : "";
              const ref = colLetter(cIdx) + r;
              if (col.type === "number" && val !== "" && !isNaN(Number(val))) {
                return makeNumberCell(ref, Number(val), col.styleIndex || 0);
              }
              return makeTextCell(ref, String(val), col.styleIndex || 0);
            }).join("");
            rowsXml.push('<row r="' + r + '">' + cells + '</row>');
          });

          const lastRow = Math.max(1, rows.length + 1);
          const lastCol = colLetter(Math.max(0, columns.length - 1));
          const safeSheetName = escXml(sheetName || "Sheet1");

          const sheetXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
              '<dimension ref="A1:' + lastCol + lastRow + '"/>' +
              '<sheetViews><sheetView workbookViewId="0"/></sheetViews>' +
              '<sheetFormatPr defaultRowHeight="18"/>' +
              '<cols>' + colsXml + '</cols>' +
              '<sheetData>' + rowsXml.join("") + '</sheetData>' +
            '</worksheet>';

          const contentTypesXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
              '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
              '<Default Extension="xml" ContentType="application/xml"/>' +
              '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
              '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
              '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
            '</Types>';

          const rootRelsXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
              '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
            '</Relationships>';

          const workbookXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
              '<sheets><sheet name="' + safeSheetName + '" sheetId="1" r:id="rId1"/></sheets>' +
            '</workbook>';

          const workbookRelsXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
              '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
              '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
            '</Relationships>';

          const stylesXml =
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
              '<fonts count="2">' +
                '<font><sz val="11"/><name val="Calibri"/></font>' +
                '<font><b/><sz val="11"/><color rgb="FF10302A"/><name val="Calibri"/></font>' +
              '</fonts>' +
              '<fills count="3">' +
                '<fill><patternFill patternType="none"/></fill>' +
                '<fill><patternFill patternType="gray125"/></fill>' +
                '<fill><patternFill patternType="solid"><fgColor rgb="FFE6F3EC"/><bgColor indexed="64"/></patternFill></fill>' +
              '</fills>' +
              '<borders count="1">' +
                '<border><left/><right/><top/><bottom/><diagonal/></border>' +
              '</borders>' +
              '<cellStyleXfs count="1">' +
                '<xf numFmtId="0" fontId="0" fillId="0" borderId="0"/>' +
              '</cellStyleXfs>' +
              '<cellXfs count="3">' +
                '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top"/></xf>' +
                '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
                '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
              '</cellXfs>' +
            '</styleSheet>';

          return buildZip([
            { name: "[Content_Types].xml", content: contentTypesXml },
            { name: "_rels/.rels", content: rootRelsXml },
            { name: "xl/workbook.xml", content: workbookXml },
            { name: "xl/_rels/workbook.xml.rels", content: workbookRelsXml },
            { name: "xl/styles.xml", content: stylesXml },
            { name: "xl/worksheets/sheet1.xml", content: sheetXml }
          ]);
        }

        function downloadBytes(bytes, filename) {
          const blob = new Blob([bytes], {
            type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 1500);
          return true;
        }

        function downloadExcel() {
          const items = loadList();
          if (items.length === 0) return false;
          const bytes = createXlsxBytes(items);
          return downloadBytes(bytes, getFilename(new Date()));
        }

        return {
          EXCEL_COLUMNS: EXCEL_COLUMNS,
          EXCEL_FIXED_VALUES: EXCEL_FIXED_VALUES,
          getAll: loadList,
          count: count,
          add: add,
          remove: remove,
          clear: clear,
          createXlsxBytes: createXlsxBytes,
          createTableXlsxBytes: createTableXlsxBytes,
          downloadBytes: downloadBytes,
          getFilename: getFilename,
          downloadExcel: downloadExcel
        };
      })();
    </script>

    <!-- =========================================================
         ITEM MODULES LIST
         Every item kind (Bolt, Hose, Screw, Nut...) lives here
         as its own separate block.
         ========================================================= -->
    <script>
      const MODULES = [
        /* ----- BOLT MODULE ----- */
        {
          id: "bolt",
          name: "Bolt",
          tileBg: "#D6F6E9",
          tileColor: "#0D3A2F",
          iconSvg:
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
              '<path d="M6 4h12l2 3.5-2 3.5H6L4 7.5 6 4z"></path>' +
              '<path d="M9 11v9l3 2 3-2v-9"></path>' +
              '<path d="M9 14.5h6"></path>' +
              '<path d="M9 17.5h6"></path>' +
            '</svg>',

          /* SAP export defaults for Bolt */
          exportDefaults: {
            materialType: "ERSA",
            baseUnit: "EA",
            materialGroup: "Mechanical"
          },

          /* Easy-to-edit Bolt dropdown lists */
          lists: {
            material: ["MS", "SS", "GI", "HT", "COPPER"],
            type: ["HEX", "ALLEN", "ANCHOR", "STUD", "WEDGE ANCHOR"],
            diameter: ["M6", "M8", "M10", "M12", "M14", "M16", "M18", "M20", "M22", "M24", "M27", "M30"],
            thread: ["FULL THD", "HALF THD", "QTR THD"],
            grade: ["G8.8", "G10.9", "G12.9", "A2-70"],
            withNut: ["No", "Yes"]
          },

          /* Easy-to-edit material colors for the drawing */
          materialColors: {
            "MS": { fill: "#8D99A6", shade: "#6E7B88", stroke: "#334155", thread: "#475569", dot: "#7A8694", shine: false },
            "SS": { fill: "#E8EEF4", shade: "#CBD5E1", stroke: "#475569", thread: "#64748B", dot: "#DCE5EE", shine: true },
            "GI": { fill: "#F3D26A", shade: "#D9AC36", stroke: "#7C5E10", thread: "#9A7618", dot: "#EAB308", shine: false },
            "HT": { fill: "#454C56", shade: "#2D323B", stroke: "#111827", thread: "#1F2937", dot: "#2B3038", shine: false },
            "COPPER": { fill: "#E08A54", shade: "#C06533", stroke: "#6E3213", thread: "#8A421D", dot: "#D97742", shine: false }
          },

          /* Easy-to-edit plain-word meanings for Long text */
          meanings: {
            material: {
              "MS": "mild steel",
              "SS": "stainless steel",
              "GI": "galvanized iron",
              "HT": "high tensile steel",
              "COPPER": "copper"
            },
            type: {
              "HEX": "hexagon head bolt",
              "ALLEN": "socket head bolt (Allen key)",
              "ANCHOR": "anchor bolt",
              "STUD": "stud bolt (threaded rod)",
              "WEDGE ANCHOR": "wedge anchor bolt"
            },
            thread: {
              "FULL THD": "fully threaded",
              "HALF THD": "half threaded",
              "QTR THD": "quarter threaded"
            },
            grade: {
              "G8.8": "strength grade 8.8",
              "G10.9": "strength grade 10.9",
              "G12.9": "strength grade 12.9",
              "A2-70": "stainless steel A2, strength class 70"
            }
          },

          /* Build SAP Short Text (max 40 chars) from current values */
          buildShortText: function (values) {
            const clean = function (v) {
              return String(v || "").trim().replace(/\s+/g, " ").toUpperCase();
            };

            const material = clean(values.material);
            const type = clean(values.type);
            const diameter = clean(values.diameter);
            const length = clean(values.length);
            const pitch = clean(values.pitch);
            const thread = clean(values.thread);
            const grade = clean(values.grade);
            const machine = clean(values.machine);
            const withNut = clean(values.withNut) === "YES" || values.withNut === true;

            const hasAnyField = Boolean(
              material || type || diameter || length || pitch || thread || grade || machine
            );
            if (!hasAnyField) {
              return "";
            }

            const size = (!diameter && !length)
              ? (pitch ? ("?X?X" + pitch) : "?")
              : [diameter || "?", length || "?", pitch].filter(Boolean).join("X");
            const typePart = type || "?";
            const withNutPart = withNut ? "WITH NUT" : "";
            const gradePart = grade || "?";
            const forMachine = machine
              ? (/^FOR(?:\s|$)/.test(machine) ? machine : ("FOR " + machine))
              : "";

            return [material, typePart, "BOLT", withNutPart, size, thread, gradePart, forMachine]
              .filter(Boolean)
              .join(" ");
          },

          /* Build plain-word Long Text from current values and meanings */
          buildLongText: function (values) {
            const mod = this;
            const clean = function (v) {
              return String(v || "").trim().replace(/\s+/g, " ");
            };
            const upper = function (v) {
              return clean(v).toUpperCase();
            };

            const matCode = upper(values.material);
            const typeCode = upper(values.type);
            const diaCode = upper(values.diameter);
            const lenVal = clean(values.length);
            const pitchVal = clean(values.pitch);
            const threadCode = upper(values.thread);
            const gradeCode = upper(values.grade);
            const machineVal = clean(values.machine);
            const withNutOn = upper(values.withNut) === "YES" || values.withNut === true;

            const hasOtherFields = Boolean(
              matCode || typeCode || diaCode || lenVal || pitchVal || threadCode || gradeCode || machineVal
            );
            if (!hasOtherFields) {
              return "";
            }

            const matText = mod.meanings.material[matCode] || "";
            const typeText = mod.meanings.type[typeCode] || "";
            const leadPhrase = [matText, typeText].filter(Boolean).join(" ");

            const parts = [];
            if (leadPhrase) {
              parts.push(leadPhrase);
            }
            if (withNutOn) {
              parts.push("supplied with a nut");
            }

            if (diaCode) {
              if (diaCode.charAt(0) === "M") {
                parts.push("metric");
                parts.push("diameter " + diaCode.slice(1) + " mm");
              } else {
                parts.push("diameter " + diaCode + " mm");
              }
            }

            if (pitchVal) {
              parts.push("pitch " + pitchVal + " mm");
            }

            if (lenVal) {
              parts.push("length " + lenVal + " mm");

            const threadText = mod.meanings.thread[threadCode] || "";

          /* Build SAP Short Text (max 40 chars) from current values */
          buildShortText: function (values) {
            const clean = function (v) {

            };
            const upper = function (v) {
              return clean(v).toUpperCase();
            };
            const lower = function (v) {
              return clean(v).toLowerCase();
            };

            const construction = upper(values.construction);
            const kind = upper(values.kind);
            const length = clean(values.length);
            const end1Size = clean(values.end1Size);
            const end1Shape = upper(values.end1Shape);
            const end1Gender = upper(values.end1Gender);
            const end1Thread = upper(values.end1Thread);
            const end2Size = clean(values.end2Size);
            const end2Shape = upper(values.end2Shape);
            const end2Gender = upper(values.end2Gender);
            const end2Thread = upper(values.end2Thread);
            const pressure = clean(values.pressure);
            const unit = lower(values.unit);

            const hasAny = Boolean(
              construction || kind || length ||
              end1Size || end1Shape || end1Gender || end1Thread ||
              end2Size || end2Shape || end2Gender || end2Thread ||
              pressure || unit
            );
            if (!hasAny) {
              return "";
            }

            const prefix = [construction, kind].filter(Boolean).join("");
            const lengthPart = length ? ("L=" + length + "m") : "";

            const buildEnd = function (sz, sh, gn, th) {
              const core = [sz, sh, gn].filter(Boolean).join("");
              if (core && th) return core + " " + th;
              return core || th || "";
            };

            const end1Part = buildEnd(end1Size, end1Shape, end1Gender, end1Thread);
            const end2Part = buildEnd(end2Size, end2Shape, end2Gender, end2Thread);
            let endsPart = "";
            if (end1Part && end2Part) {
              endsPart = end1Part + "-" + end2Part;
            } else {
              endsPart = end1Part || end2Part;
            }

            let wpPart = "";
            if (pressure || unit) {
              wpPart = "WP" + pressure + unit;
            }

            return [prefix, lengthPart, endsPart, wpPart]
              .filter(Boolean)
              .join(",");
          },

          /* Build plain-word Long Text from current values and meanings */

            const pressureVal = clean(values.pressure);
            const unitCode = lower(values.unit);

            const conText = mod.meanings.construction[conCode] || "";
            const kindText = mod.meanings.kind[kindCode] || "";
            const leadPhrase = [conText, kindText].filter(Boolean).join(" ");

            const parts = [];

              const gnText = mod.meanings.gender[upper(gn)] || "";
              const thText = clean(th);
              const endWords = [szText, shText, gnText, thText].filter(Boolean).join(" ");
              if (endWords) {

            buildEndLong("end 2", values.end2Size, values.end2Shape, values.end2Gender, values.end2Thread);

            const unitText = mod.meanings.unit[unitCode] || "";

            } else if (pressureVal) {
              parts.push("working pressure " + pressureVal);

          /* Build clean live SVG drawing of hose + metal end fittings + labels */
          buildDrawingSvg: function (values, shortNameText) {
            const mod = this;
            const clean = function (v) {
              return String(v || "").trim().replace(/\s+/g, " ");
            };
            const upper = function (v) {
              return clean(v).toUpperCase();
            };
            const lower = function (v) {
              return clean(v).toLowerCase();
            };
            const esc = function (s) {
              return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
            };
            const wrapLines = function (text, maxChars) {
              const str = clean(text);
              if (!str) return [];
              const words = str.split(" ");
              const lines = [];
              let current = "";
              words.forEach(function (w) {
                if (w.length > maxChars) {
                  if (current) {
                    lines.push(current);
                    current = "";
                  }
                  for (let i = 0; i < w.length; i += maxChars) {
                    lines.push(w.slice(i, i + maxChars));
                  }
                } else if (!current) {
                  current = w;
                } else if ((current + " " + w).length <= maxChars) {
                  current += " " + w;
                } else {
                  lines.push(current);
                  current = w;
                }
              });
              if (current) lines.push(current);
              return lines;
            };

            const construction = upper(values.construction);
            const kind = upper(values.kind);
            const lengthVal = clean(values.length);
            const pressureVal = clean(values.pressure);
            const unitCode = lower(values.unit);

            const e1Size = clean(values.end1Size);
            const e1Shape = upper(values.end1Shape);
            const e1Gender = upper(values.end1Gender);
            const e1Thread = clean(values.end1Thread);

            const e2Size = clean(values.end2Size);
            const e2Shape = upper(values.end2Shape);
            const e2Gender = upper(values.end2Gender);
            const e2Thread = clean(values.end2Thread);

            /* Top short-name lines */
            const topText = clean(shortNameText);
            const topLines = topText ? wrapLines(topText, 32) : ["NEW HOSE"];
            const topIsPlaceholder = !topText;
            const yOffset = Math.max(0, topLines.length - 1) * 15;

            const topSvg = topLines.map(function (line, i) {
              const y = 22 + i * 15;
              const color = topIsPlaceholder ? "#94A3B8" : "#10302A";
              return (
                '<text x="180" y="' + y + '" text-anchor="middle" font-size="13" font-weight="700" fill="' + color + '">' +
                  esc(line) +
                '</text>'
              );
            }).join("");

            /* Hose arch coordinates from x=88 to x=272 */
            const yBase = 152 + yOffset;
            const yPeak = 114 + yOffset;
            const archD = "M 88 " + yBase + " C 138 " + yPeak + ", 222 " + yPeak + ", 272 " + yBase;

            let bodyFill = "#E2E8F0";
            let bodyStroke = "#94A3B8";
            let highlightStroke = "#F1F5F9";
            let textureSvg = "";

            if (construction === "WW") {
              bodyFill = "#1E293B";
              bodyStroke = "#0F172A";
              highlightStroke = "#475569";
            } else if (construction === "SB") {
              bodyFill = "#1E293B";
              bodyStroke = "#0F172A";
              highlightStroke = "#475569";
            } else if (construction === "SS") {
              bodyFill = "#CBD5E1";
              bodyStroke = "#64748B";
              highlightStroke = "#F1F5F9";
            }

            /* Sample points along the cubic Bezier for crisp spiral / braid texture */
            const bezPt = function (t) {
              const mt = 1 - t;
              const x = mt * mt * mt * 88 + 3 * mt * mt * t * 138 + 3 * mt * t * t * 222 + t * t * t * 272;
              const y = mt * mt * mt * yBase + 3 * mt * mt * t * yPeak + 3 * mt * t * t * yPeak + t * t * t * yBase;
              const dx = 3 * mt * mt * (138 - 88) + 6 * mt * t * (222 - 138) + 3 * t * t * (272 - 222);
              const dy = 3 * mt * mt * (yPeak - yBase) + 6 * mt * t * 0 + 3 * t * t * (yBase - yPeak);
              const len = Math.hypot(dx, dy) || 1;
              return { x: x, y: y, nx: -dy / len, ny: dx / len };
            };

            if (construction === "WW") {
              const spirals = [];
              for (let i = 1; i <= 15; i++) {

                  textarea.select();

          /* Build SAP Short Text (max 40 chars) from current values */
          buildShortText: function (values) {
            const clean = function (v) {
              return String(v || "").trim().replace(/\s+/g, " ").toUpperCase();
            };

            const material = clean(values.material);
            const type = clean(values.type);
            const diameter = clean(values.diameter);
            const pitch = clean(values.pitch);
            const grade = clean(values.grade);
            const machine = clean(values.machine);

            const hasAnyField = Boolean(
              material || type || diameter || pitch || grade || machine
            );
            if (!hasAnyField) {
              return "";
            }

            const size = [diameter, pitch].filter(Boolean).join("X");
            const forMachine = machine
              ? (/^FOR(?:\s|$)/.test(machine) ? machine : ("FOR " + machine))
              : "";

            return [material, type, "NUT", size, grade, forMachine]
              .filter(Boolean)
              .join(" ");
          },

          /* Build plain-word Long Text from current values and meanings */
          buildLongText: function (values) {
            const mod = this;
            const clean = function (v) {
              return String(v || "").trim().replace(/\s+/g, " ");
            };
            const upper = function (v) {
              return clean(v).toUpperCase();
            };

            const matCode = upper(values.material);
            const typeCode = upper(values.type);
            const diaCode = upper(values.diameter);
            const pitchVal = clean(values.pitch);
            const gradeCode = upper(values.grade);
            const machineVal = clean(values.machine);

            const matText = mod.meanings.material[matCode] || "";
            const typeText = mod.meanings.type[typeCode] || "";
            const leadPhrase = [matText, typeText].filter(Boolean).join(" ");

            const parts = [];
            if (leadPhrase) {
              parts.push(leadPhrase);
            }

            if (diaCode) {
              if (diaCode.charAt(0) === "M") {
                parts.push("metric");
                parts.push("diameter " + diaCode.slice(1) + " mm");
              } else {
                parts.push("diameter " + diaCode + " mm");
              }
            }

            if (pitchVal) {
              parts.push("pitch " + pitchVal + " mm");
            }

            const gradeText = mod.meanings.grade[gradeCode] || "";
            if (gradeText) {
              parts.push(gradeText);
            }

            let sentence = "";
            if (parts.length > 0) {
              const joined = parts.join(", ");
              sentence = joined.charAt(0).toUpperCase() + joined.slice(1) + ".";
            }

            if (machineVal) {
              const machineClause = "For machine: " + machineVal + ".";
              sentence = sentence ? (sentence + " " + machineClause) : machineClause;
            }

            return sentence;

            if (!String(values.diameter || "").trim()) missing.push("Diameter");

            };
            const esc = function (s) {
              return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
            };
            const wrapLines = function (text, maxChars) {
              const str = clean(text);
              if (!str) return [];
              const words = str.split(" ");
              const lines = [];
              let current = "";
              words.forEach(function (w) {
                if (w.length > maxChars) {
                  if (current) {
                    lines.push(current);
                    current = "";
                  }
                  for (let i = 0; i < w.length; i += maxChars) {
                    lines.push(w.slice(i, i + maxChars));
                  }
                } else if (!current) {
                  current = w;
                } else if ((current + " " + w).length <= maxChars) {
                  current += " " + w;
                } else {
                  lines.push(current);
                  current = w;
                }
              });
              if (current) lines.push(current);
              return lines;
            };
            const hexPoints = function (hx, hy, rad) {
              const pts = [];
              for (let k = 0; k < 6; k++) {
                const ang = (k * 60) * Math.PI / 180;
                pts.push((hx + rad * Math.cos(ang)).toFixed(1) + "," + (hy + rad * Math.sin(ang)).toFixed(1));
              }
              return pts.join(" ");
            };

            const material = upper(values.material);
            const type = upper(values.type);
            const diameter = upper(values.diameter);
            const pitch = clean(values.pitch);
            const grade = upper(values.grade);
            const machine = clean(values.machine);

            let pitchSvg = "";

              return (

              const len = nameBox.value.length;
              const isOver = len > 40;
              const isNear = len >= 36 && !isOver;

              nameBox.classList.toggle("is-over", isOver);
              charCounter.classList.toggle("is-near", isNear);

              charCounter.textContent = isOver ? ("Too long: " + len + " / 40") : (len + " / 40");

              if (missing.length > 0) {
                missingNote.textContent = "Missing: " + missing.join(", ");

              nameBox.value = mod.buildShortText(readFieldValues());

              updateDrawing();

                  buttonEl.textContent = "Copy";
                }, 1400);
              };

              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(showCopied).catch(function () {
                  textarea.select();
                  document.execCommand("copy");
                  showCopied();
                });
              } else {
                textarea.select();
                document.execCommand("copy");
                showCopied();
              }
            }

              el.addEventListener("input", rebuildAllFromFields);
              el.addEventListener("change", rebuildAllFromFields);

              if (nameBox.value !== upper) {

              if (!shortName) {
                reasons.push("Short name is empty");
              } else if (shortName.length > 40) {
                reasons.push("Short name is over 40 characters (" + shortName.length + " / 40)");
              }

                showExportFeedback("Cannot add: " + reasons.join(". ") + ".", true);
                return;

                moduleName: mod.name,
                shortName: shortName,
                longText: longText,
                fields: {
                  material: String(values.material || "").trim(),
                  type: String(values.type || "").trim(),
                  diameter: String(values.diameter || "").trim(),
                  pitch: String(values.pitch || "").trim(),

                  baseUnit: mod.exportDefaults.baseUnit,
                  materialGroup: mod.exportDefaults.materialGroup
                }
              });

              showExportFeedback(
                "Added. " + newCount + (newCount === 1 ? " item" : " items") + " in the list",
                false
              );
            });

            backBtn.addEventListener("click", goBack);

            rebuildAllFromFields();

              exportFeedback.textContent = message;
              exportFeedback.className = "add-export-feedback " + (isError ? "is-error" : "is-success");
            }

            function updateStatusDisplay() {
              const len = nameBox.value.length;
              const isOver = len > 40;
              const isNear = len >= 36 && !isOver;

              nameBox.classList.toggle("is-over", isOver);
              charCounter.classList.toggle("is-near", isNear);
              charCounter.classList.toggle("is-over", isOver);
              charCounter.textContent = isOver ? ("Too long: " + len + " / 40") : (len + " / 40");

              const missing = mod.getMissingRequired(readFieldValues());
              if (missing.length > 0) {
                missingNote.textContent = "Missing: " + missing.join(", ");
                missingNote.classList.remove("is-hidden");
              } else {
                missingNote.textContent = "";
                missingNote.classList.add("is-hidden");
              }
            }

            function updateDrawing() {
              drawingFrame.innerHTML = mod.buildDrawingSvg(readFieldValues(), nameBox.value);
            }

            function rebuildShortFromFields() {
              nameBox.value = mod.buildShortText(readFieldValues());
              updateStatusDisplay();
              updateDrawing();
              clearExportFeedback();
            }

            function rebuildLongFromFields() {
              longBox.value = mod.buildLongText(readFieldValues());
            }

            function rebuildAllFromFields() {
              rebuildShortFromFields();
              rebuildLongFromFields();
            }

            function copyTextarea(textarea, buttonEl) {
              const textToCopy = textarea.value;
              const showCopied = function () {
                buttonEl.textContent = "Copied";
                setTimeout(function () {
                  buttonEl.textContent = "Copy";
                }, 1400);
              };

              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(showCopied).catch(function () {
                  textarea.select();
                  document.execCommand("copy");
                  showCopied();
                });
              } else {
                textarea.select();
                document.execCommand("copy");
                showCopied();
              }
            }

            Object.keys(inputs).forEach(function (key) {
              const el = inputs[key];
              el.addEventListener("input", rebuildAllFromFields);
              el.addEventListener("change", rebuildAllFromFields);
            });

            nameBox.addEventListener("input", function () {
              const start = nameBox.selectionStart;
              const end = nameBox.selectionEnd;
              const upper = nameBox.value.toUpperCase();
              if (nameBox.value !== upper) {
                nameBox.value = upper;
                if (typeof start === "number" && typeof end === "number") {
                  nameBox.setSelectionRange(start, end);
                }
              }
              updateStatusDisplay();
              updateDrawing();
              clearExportFeedback();
            });

            rebuildBtn.addEventListener("click", rebuildShortFromFields);

            copyBtn.addEventListener("click", function () {
              copyTextarea(nameBox, copyBtn);
            });

            longRebuildBtn.addEventListener("click", rebuildLongFromFields);

            longCopyBtn.addEventListener("click", function () {
              copyTextarea(longBox, longCopyBtn);
            });

            addExportBtn.addEventListener("click", function () {
              const values = readFieldValues();
              const shortName = String(nameBox.value || "").trim();
              const longText = String(longBox.value || "").trim();
              const missing = mod.getMissingRequired(values);
              const reasons = [];

              if (missing.length > 0) {
                reasons.push("Missing required: " + missing.join(", "));
              }
              if (!shortName) {
                reasons.push("Short name is empty");
              } else if (shortName.length > 40) {
                reasons.push("Short name is over 40 characters (" + shortName.length + " / 40)");
              }

              if (reasons.length > 0) {
                showExportFeedback("Cannot add: " + reasons.join(". ") + ".", true);
                return;
              }

              const newCount = QSExport.add({
                moduleId: mod.id,
                moduleName: mod.name,
                shortName: shortName,
                longText: longText,
                fields: {
                  material: String(values.material || "").trim(),
                  type: String(values.type || "").trim(),
                  diameter: String(values.diameter || "").trim(),
                  length: String(values.length || "").trim(),
                  pitch: String(values.pitch || "").trim(),
                  thread: String(values.thread || "").trim(),
                  grade: String(values.grade || "").trim(),
                  head: String(values.head || "").trim(),
                  forText: String(values.forText || "").trim()
                },
                sapDefaults: {
                  materialType: mod.exportDefaults.materialType,
                  baseUnit: mod.exportDefaults.baseUnit,
                  materialGroup: mod.exportDefaults.materialGroup
                }
              });

              showExportFeedback(
                "Added. " + newCount + (newCount === 1 ? " item" : " items") + " in the list",
                false
              );
            });

            backBtn.addEventListener("click", goBack);

            rebuildAllFromFields();
          }

          /* Build clean Sand paper SVG drawing (dot size and brown shade follow grit) */
          buildDrawingSvg: function (values, shortNameText) {

          /* Draw the Sand paper screen */

                '</div>' +
              '</section>' +

              '<section class="card name-card card-stagger" style="--card-index: 2;">' +
                '<div class="name-card-top">' +
                  '<h2 class="name-card-title">Long text</h2>' +
                  '<div class="name-actions">' +
                    '<button type="button" class="btn-secondary" id="sandpaper-long-rebuild-btn">Rebuild</button>' +
                    '<button type="button" class="btn-primary" id="sandpaper-long-copy-btn">Copy</button>' +
                  '</div>' +
                '</div>' +

                '<textarea id="sandpaper-long-box" class="name-textarea long-textarea" rows="3" aria-label="Long text" placeholder="Pick fields below to build long text..."></textarea>' +
              '</section>' +

              '<section class="card name-card card-stagger" style="--card-index: 3;">' +
                '<div class="name-card-top">' +
                  '<h2 class="name-card-title">Drawing</h2>' +
                '</div>' +

              '</section>' +

              '<section class="card add-export-card card-stagger" style="--card-index: 4;">' +
                '<button type="button" class="btn-primary add-export-btn" id="sandpaper-add-export-btn">Add to export list</button>' +
                '<p id="sandpaper-export-feedback" class="add-export-feedback is-hidden" role="status" aria-live="polite"></p>' +
              '</section>' +

                '<div class="fields-grid">' +
                  '<div class="field-group">' +

                      makeOptionsHtml(mod.lists.grit, "Select grit") +

                  '</div>' +

            const backBtn = document.getElementById("sandpaper-back-btn");
            const nameBox = document.getElementById("sandpaper-name-box");
            const charCounter = document.getElementById("sandpaper-char-counter");
            const missingNote = document.getElementById("sandpaper-missing-note");
            const rebuildBtn = document.getElementById("sandpaper-rebuild-btn");
            const copyBtn = document.getElementById("sandpaper-copy-btn");
            const longBox = document.getElementById("sandpaper-long-box");
            const longRebuildBtn = document.getElementById("sandpaper-long-rebuild-btn");
            const longCopyBtn = document.getElementById("sandpaper-long-copy-btn");

            const addExportBtn = document.getElementById("sandpaper-add-export-btn");
            const exportFeedback = document.getElementById("sandpaper-export-feedback");

            const inputs = {
              grit: document.getElementById("sandpaper-grit")

            function readFieldValues() {
              return {
                grit: inputs.grit.value
              };
            }

            function clearExportFeedback() {
              exportFeedback.textContent = "";
              exportFeedback.className = "add-export-feedback is-hidden";

              exportFeedback.textContent = message;
              exportFeedback.className = "add-export-feedback " + (isError ? "is-error" : "is-success");
            }

            function updateStatusDisplay() {
              const len = nameBox.value.length;
              const isOver = len > 40;
              const isNear = len >= 36 && !isOver;

              nameBox.classList.toggle("is-over", isOver);
              charCounter.classList.toggle("is-near", isNear);
              charCounter.classList.toggle("is-over", isOver);
              charCounter.textContent = isOver ? ("Too long: " + len + " / 40") : (len + " / 40");

              const missing = mod.getMissingRequired(readFieldValues());
              if (missing.length > 0) {
                missingNote.textContent = "Missing: " + missing.join(", ");
                missingNote.classList.remove("is-hidden");
              } else {
                missingNote.textContent = "";
                missingNote.classList.add("is-hidden");
              }
