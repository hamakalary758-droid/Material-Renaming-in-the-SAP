                '<span class="export-count-text" id="export-items-count">' + countLabel + '</span>' +
              '</div>' +
              '<div class="export-actions-row">' +
                '<button type="button" class="download-excel-btn" id="download-excel-btn"' + (count === 0 ? ' disabled' : '') + '>' +
                  'Download Excel' +
                '</button>' +
                (count > 0
                  ? '<button type="button" class="clear-all-btn" id="export-clear-btn">Clear all</button>'
                  : '') +
              '</div>' +
              '<div class="clear-confirm-bar is-hidden" id="export-clear-confirm">' +
                '<p class="clear-confirm-text">Are you sure?</p>' +
                '<div class="clear-confirm-actions">' +
                  '<button type="button" class="btn-secondary" id="export-clear-cancel">Cancel</button>' +
                  '<button type="button" class="btn-danger" id="export-clear-yes">Yes, clear all</button>' +
                '</div>' +
              '</div>' +
            '</section>' +
            listHtml;

          const downloadBtn = document.getElementById("download-excel-btn");
          if (downloadBtn) {
            downloadBtn.addEventListener("click", function () {
              QSExport.downloadExcel();
            });
          }

          const clearBtn = document.getElementById("export-clear-btn");
          const clearConfirm = document.getElementById("export-clear-confirm");
          const clearCancel = document.getElementById("export-clear-cancel");
          const clearYes = document.getElementById("export-clear-yes");

          if (clearBtn && clearConfirm) {
            clearBtn.addEventListener("click", function () {
              clearConfirm.classList.remove("is-hidden");
            });
          }
          if (clearCancel && clearConfirm) {
            clearCancel.addEventListener("click", function () {
              clearConfirm.classList.add("is-hidden");
            });
          }
          if (clearYes) {
            clearYes.addEventListener("click", function () {
              QSExport.clear();
              renderExportPage();
              attachCardTouchLift(pageRoot);
            });
          }

          pageRoot.querySelectorAll(".export-delete-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
              const id = btn.getAttribute("data-delete-id");
              if (id) {
                QSExport.remove(id);
                renderExportPage();
                attachCardTouchLift(pageRoot);
              }
            });
          });
        }

        function renderExistingPage(viewState) {
          const st = QSExisting.state;
          const view = viewState || { mode: "overview", kindId: "", filter: "all", search: "", limit: 50, rowIndex: -1 };

          function triggerExistingTransition(nextView) {
            pageRoot.classList.remove("page-enter");
            void pageRoot.offsetWidth;
            renderExistingPage(nextView);
            if (!prefersReducedMotion()) {
              pageRoot.classList.add("page-enter");
            }
            attachCardTouchLift(pageRoot);
          }

          /* ----- MODE 3: SINGLE ITEM REVIEW SCREEN ----- */
          if (view.mode === "review") {
            const item = st.items[view.rowIndex];
            if (!item) {
              triggerExistingTransition({ mode: "list", kindId: view.kindId || "other", filter: view.filter || "all", search: view.search || "", limit: view.limit || 50 });
              return;
            }

            const kindItems = st.items.filter(function (it) { return it.kindId === item.kindId; });
            const posInKind = kindItems.findIndex(function (it) { return it.rowIndex === item.rowIndex; });
            const mod = MODULES.find(function (m) { return m.id === item.kindId; }) || null;
            const kindLabel = mod ? mod.name : "Other";
            const stats = QSExisting.getKindStats().byId[item.kindId];
            const acceptedPct = stats && stats.total > 0 ? Math.round((stats.accepted / stats.total) * 100) : 0;

            const statusBadgeClass =
              item.status === "accepted" ? "is-accepted" :
              (item.status === "skipped" ? "is-skipped" :
              (item.status === "other" ? "is-other" : "is-new"));

            /* For "Other" items, show clear inspection & optional re-classify into a module */
            if (!mod) {
              const nextItem = (posInKind >= 0 && posInKind + 1 < kindItems.length) ? kindItems[posInKind + 1] : null;
              pageRoot.innerHTML =
                '<div class="item-header card-stagger" style="--card-index: 0;">' +
                  '<button type="button" class="back-btn" id="rev-back-btn" aria-label="Back to Other list">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                      '<path d="M15 18l-6-6 6-6"></path>' +
                    '</svg>' +
                  '</button>' +
                  '<h1 class="item-screen-title">Other (' + (posInKind + 1) + ' of ' + kindItems.length + ')</h1>' +
                  '<span class="status-badge ' + statusBadgeClass + '">' + escHtml(QSExisting.formatStatusLabel(item.status)) + '</span>' +
                '</div>' +

                '<section class="card review-old-card card-stagger" style="--card-index: 1;">' +
                  '<p class="review-mat-label">Material: ' + escHtml(item.materialNumber || "(No number)") + '</p>' +
                  '<p class="review-old-desc">' + escHtml(item.oldDescription || "(Empty description)") + '</p>' +
                '</section>' +

                '<section class="card card-stagger" style="--card-index: 2;">' +
                  '<div class="field-group">' +
                    '<div class="field-label-row">' +
                      '<label class="field-label" for="other-move-select">Move to an item kind (optional)</label>' +
                      '<span class="field-tag is-optional">Optional</span>' +
                    '</div>' +
                    '<select id="other-move-select" class="field-control">' +
                      '<option value="">Keep in Other</option>' +
                      MODULES.map(function (m) {
                        return '<option value="' + escHtml(m.id) + '">' + escHtml(m.name) + '</option>';
                      }).join("") +
                    '</select>' +
                  '</div>' +
                  '<div class="review-actions-grid" style="margin-top: 12px;">' +
                    '<button type="button" class="btn-secondary" id="rev-bottom-back-btn">Back</button>' +
                    '<button type="button" class="btn-secondary" id="rev-next-btn"' + (nextItem ? '' : ' disabled') + '>Next</button>' +
                  '</div>' +
                '</section>';

              document.getElementById("rev-back-btn").addEventListener("click", function () {
                triggerExistingTransition({ mode: "list", kindId: "other", filter: view.filter || "all", search: view.search || "", limit: view.limit || 50 });
              });
              document.getElementById("rev-bottom-back-btn").addEventListener("click", function () {
                triggerExistingTransition({ mode: "list", kindId: "other", filter: view.filter || "all", search: view.search || "", limit: view.limit || 50 });
              });
              document.getElementById("rev-next-btn").addEventListener("click", function () {
                if (nextItem) {
                  triggerExistingTransition(Object.assign({}, view, { rowIndex: nextItem.rowIndex }));
                }
              });
              document.getElementById("other-move-select").addEventListener("change", function (e) {
                const targetKind = e.target.value;
                if (targetKind) {
                  QSExisting.updateItemDecision(item, "new", { kindId: targetKind });
                  triggerExistingTransition({ mode: "review", kindId: targetKind, filter: "all", search: "", limit: 50, rowIndex: item.rowIndex });
                }
              });
              return;
            }

            /* Standard Module Review Screen */
            const fieldsSpec = QSExisting.getFieldsSpec(mod);
            const initialValues = item.fields ? Object.assign({}, item.fields) : QSExisting.prefillFields(mod, item.oldDescription);

            function escAttrVal(s) {
              return String(s == null ? "" : s)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            }

            const fieldsHtml = fieldsSpec.map(function (f) {
              if (f.sectionTitle) {
                return '<p class="fields-subsection-title">' + escHtml(f.sectionTitle) + '</p>';
              }
              const val = initialValues[f.key] != null
                ? String(initialValues[f.key])
                : (f.defaultValue != null ? String(f.defaultValue) : "");
              const tagHtml = f.required
                ? '<span class="field-tag is-required">Required</span>'
                : '<span class="field-tag is-optional">Optional</span>';

              let controlHtml = "";
              if (f.type === "select") {
                const opts = f.noBlankOption ? [] : ['<option value="">' + escHtml(f.placeholder || "Select") + '</option>'];
                (f.options || []).forEach(function (opt) {
                  const oVal = (typeof opt === "object") ? opt.code : opt;
                  const oLbl = (typeof opt === "object") ? opt.label : opt;
                  const sel = (String(oVal) === val) ? " selected" : "";
                  opts.push('<option value="' + escAttrVal(oVal) + '"' + sel + '>' + escHtml(oLbl) + '</option>');
                });
                controlHtml = '<select id="rev-field-' + escAttrVal(f.key) + '" class="field-control">' + opts.join("") + '</select>';
              } else if (f.type === "number") {
                controlHtml = '<input id="rev-field-' + escAttrVal(f.key) + '" type="number" inputmode="decimal" step="any" class="field-control" value="' + escAttrVal(val) + '" placeholder="' + escAttrVal(f.placeholder || "") + '" />';
              } else {
                controlHtml = '<input id="rev-field-' + escAttrVal(f.key) + '" type="text" class="field-control" value="' + escAttrVal(val) + '" placeholder="' + escAttrVal(f.placeholder || "") + '" />';
              }

              return (
                '<div class="field-group">' +
                  '<div class="field-label-row">' +
                    '<label class="field-label" for="rev-field-' + escAttrVal(f.key) + '">' + escHtml(f.label) + '</label>' +
                    tagHtml +
                  '</div>' +
                  controlHtml +
                '</div>'
              );
            }).join("");

            const nextItem = (posInKind >= 0 && posInKind + 1 < kindItems.length) ? kindItems[posInKind + 1] : null;

            pageRoot.innerHTML =
              '<div class="item-header card-stagger" style="--card-index: 0;">' +
                '<button type="button" class="back-btn" id="rev-back-btn" aria-label="Back to ' + escAttrVal(kindLabel) + ' list">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="M15 18l-6-6 6-6"></path>' +
                  '</svg>' +
                '</button>' +
                '<h1 class="item-screen-title">Review ' + escHtml(kindLabel) + ' (' + (posInKind + 1) + ' of ' + kindItems.length + ')</h1>' +
                '<span id="rev-status-badge" class="status-badge ' + statusBadgeClass + '">' + escHtml(QSExisting.formatStatusLabel(item.status)) + '</span>' +
              '</div>' +

              '<section class="card card-stagger" style="--card-index: 1;">' +
                '<div class="progress-header">' +
                  '<h2 class="card-label">' + escHtml(kindLabel) + ' progress</h2>' +
                  '<span id="rev-progress-text" class="progress-numbers">' + (stats ? stats.accepted : 0) + ' / ' + (stats ? stats.total : 0) + ' accepted</span>' +
                '</div>' +
                '<div class="progress-track">' +
                  '<div class="progress-fill is-grown" id="rev-progress-fill" style="width: ' + acceptedPct + '%;"></div>' +
                '</div>' +
              '</section>' +

              '<section class="card review-old-card card-stagger" style="--card-index: 2;">' +
                '<p class="review-mat-label">Material: ' + escHtml(item.materialNumber || "(No number)") + '</p>' +
                '<p class="review-old-desc">' + escHtml(item.oldDescription || "(Empty description)") + '</p>' +
              '</section>' +

              '<section class="card card-stagger" style="--card-index: 3;">' +
                '<div class="fields-grid">' + fieldsHtml + '</div>' +
              '</section>' +

              '<section class="card name-card card-stagger" style="--card-index: 4;">' +
                '<div class="name-card-top">' +
                  '<h2 class="name-card-title">New Short Name</h2>' +
                  '<div class="name-actions">' +
                    '<button type="button" class="btn-secondary" id="rev-short-rebuild-btn">Rebuild</button>' +
                    '<button type="button" class="btn-primary" id="rev-short-copy-btn">Copy</button>' +
                  '</div>' +
                '</div>' +
                '<textarea id="rev-short-box" class="name-textarea" rows="2" aria-label="New Short Name" spellcheck="false" placeholder="PICK FIELDS ABOVE TO BUILD NAME..."></textarea>' +
                '<div class="name-meta-row">' +
                  '<span id="rev-char-counter" class="char-counter">0 / 40</span>' +
                  '<p id="rev-missing-note" class="missing-note"></p>' +
                '</div>' +
              '</section>' +

              '<section class="card name-card card-stagger" style="--card-index: 5;">' +
                '<div class="name-card-top">' +
                  '<h2 class="name-card-title">New Long Text</h2>' +
                  '<div class="name-actions">' +
                    '<button type="button" class="btn-secondary" id="rev-long-rebuild-btn">Rebuild</button>' +
                    '<button type="button" class="btn-primary" id="rev-long-copy-btn">Copy</button>' +
                  '</div>' +
                '</div>' +
                '<textarea id="rev-long-box" class="name-textarea long-textarea" rows="3" aria-label="New Long Text" placeholder="Pick fields above to build long text..."></textarea>' +
              '</section>' +

              (typeof mod.buildDrawingSvg === "function"
                ? '<section class="card name-card card-stagger" style="--card-index: 6;">' +
                    '<div class="name-card-top">' +
                      '<h2 class="name-card-title">Drawing</h2>' +
                    '</div>' +
                    '<div id="rev-drawing-frame" class="drawing-frame"></div>' +
                  '</section>'
                : '') +

              '<section class="card add-export-card card-stagger" style="--card-index: 7;">' +
                '<div class="review-actions-grid">' +
                  '<button type="button" class="btn-primary btn-accept-full" id="rev-accept-btn">Accept</button>' +
                  '<button type="button" class="btn-secondary" id="rev-skip-btn">Skip</button>' +
                  '<button type="button" class="btn-warning-outline" id="rev-not-kind-btn">Not this kind</button>' +
                  '<button type="button" class="btn-secondary" id="rev-bottom-back-btn">Back</button>' +
                  '<button type="button" class="btn-secondary" id="rev-next-btn"' + (nextItem ? '' : ' disabled') + '>Next</button>' +
                '</div>' +
                '<p id="rev-feedback" class="add-export-feedback is-hidden" role="status" aria-live="polite"></p>' +
              '</section>';

            const fieldInputs = {};
            fieldsSpec.forEach(function (f) {
              if (!f.sectionTitle) {
                fieldInputs[f.key] = document.getElementById("rev-field-" + f.key);
              }
            });

            const shortBox = document.getElementById("rev-short-box");
            const longBox = document.getElementById("rev-long-box");
            const drawingFrame = document.getElementById("rev-drawing-frame");
            const charCounter = document.getElementById("rev-char-counter");
            const missingNote = document.getElementById("rev-missing-note");
            const statusBadgeEl = document.getElementById("rev-status-badge");
            const progressTextEl = document.getElementById("rev-progress-text");
            const progressFillEl = document.getElementById("rev-progress-fill");
            const feedbackEl = document.getElementById("rev-feedback");

            function readReviewValues() {
              const out = {};
              Object.keys(fieldInputs).forEach(function (k) {
                if (fieldInputs[k]) out[k] = fieldInputs[k].value;
              });
              return out;
            }

            function clearReviewFeedback() {
              feedbackEl.textContent = "";
              feedbackEl.className = "add-export-feedback is-hidden";
            }

            function showReviewFeedback(msg, isErr) {
              feedbackEl.textContent = msg;
              feedbackEl.className = "add-export-feedback " + (isErr ? "is-error" : "is-success");
            }

            function refreshKindBarAndBadge() {
              const s = QSExisting.getKindStats().byId[item.kindId];
              if (s) {
                progressTextEl.textContent = s.accepted + " / " + s.total + " accepted";
                const pct = s.total > 0 ? Math.round((s.accepted / s.total) * 100) : 0;
                progressFillEl.style.width = pct + "%";
              }
              statusBadgeEl.textContent = QSExisting.formatStatusLabel(item.status);
              statusBadgeEl.className = "status-badge " + (
                item.status === "accepted" ? "is-accepted" :
                (item.status === "skipped" ? "is-skipped" :
                (item.status === "other" ? "is-other" : "is-new"))
              );
            }

            function updateShortMeta() {
              const len = shortBox.value.length;
              const isOver = len > 40;
              const isNear = len >= 36 && !isOver;
              shortBox.classList.toggle("is-over", isOver);
              charCounter.classList.toggle("is-near", isNear);
              charCounter.classList.toggle("is-over", isOver);
              charCounter.textContent = isOver ? ("Too long: " + len + " / 40") : (len + " / 40");

              const missing = mod.getMissingRequired(readReviewValues());
              if (missing.length > 0) {
                missingNote.textContent = "Missing: " + missing.join(", ");
                missingNote.classList.remove("is-hidden");
              } else {
                missingNote.textContent = "";
                missingNote.classList.add("is-hidden");
              }
            }

            function updateReviewDrawing() {
              if (drawingFrame && typeof mod.buildDrawingSvg === "function") {
                drawingFrame.innerHTML = mod.buildDrawingSvg(readReviewValues(), shortBox.value);
              }
            }

            function rebuildReviewShort() {
              shortBox.value = mod.buildShortText(readReviewValues());
              updateShortMeta();
              updateReviewDrawing();
              clearReviewFeedback();
            }

            function rebuildReviewLong() {
              longBox.value = mod.buildLongText(readReviewValues());
            }

            function rebuildAll() {
              rebuildReviewShort();
              rebuildReviewLong();
            }

            function copyBox(textarea, btnEl) {
              const textToCopy = textarea.value;
              const done = function () {
                btnEl.textContent = "Copied";
                setTimeout(function () { btnEl.textContent = "Copy"; }, 1400);
              };
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(done).catch(function () {
                  textarea.select();
                  document.execCommand("copy");
                  done();
                });
              } else {
                textarea.select();
                document.execCommand("copy");
                done();
              }
            }

            Object.keys(fieldInputs).forEach(function (k) {
              const el = fieldInputs[k];
              if (!el) return;
              el.addEventListener("input", rebuildAll);
              el.addEventListener("change", rebuildAll);
            });

            shortBox.addEventListener("input", function () {
              if (mod.id !== "hose") {
                const start = shortBox.selectionStart;
                const end = shortBox.selectionEnd;
                const upper = shortBox.value.toUpperCase();
                if (shortBox.value !== upper) {
                  shortBox.value = upper;
                  if (typeof start === "number" && typeof end === "number") {
                    shortBox.setSelectionRange(start, end);
                  }
                }
              }
              updateShortMeta();
              updateReviewDrawing();
              clearReviewFeedback();
            });

            /* Initialize boxes: keep saved edits if already saved, else build live from pre-filled fields */
            if (item.fields && item.shortName) {
              shortBox.value = item.shortName;
              longBox.value = item.longText || mod.buildLongText(readReviewValues());
              updateShortMeta();
              updateReviewDrawing();
            } else {
              rebuildAll();
            }

            document.getElementById("rev-short-rebuild-btn").addEventListener("click", rebuildReviewShort);
            document.getElementById("rev-long-rebuild-btn").addEventListener("click", rebuildReviewLong);
            document.getElementById("rev-short-copy-btn").addEventListener("click", function () {
              copyBox(shortBox, this);
            });
            document.getElementById("rev-long-copy-btn").addEventListener("click", function () {
              copyBox(longBox, this);
            });

            const goBackToList = function () {
              triggerExistingTransition({ mode: "list", kindId: item.kindId, filter: view.filter || "all", search: view.search || "", limit: view.limit || 50 });
            };
            document.getElementById("rev-back-btn").addEventListener("click", goBackToList);
            document.getElementById("rev-bottom-back-btn").addEventListener("click", goBackToList);

            document.getElementById("rev-accept-btn").addEventListener("click", function () {
              const values = readReviewValues();
              const shortName = String(shortBox.value || "").trim();
              const longText = String(longBox.value || "").trim();
              const missing = mod.getMissingRequired(values);
              const reasons = [];
              if (missing.length > 0) {
                reasons.push("Missing required: " + missing.join(", "));
              }
              if (!shortName) {
                reasons.push("New short name is empty");
              } else if (shortName.length > 40) {
                reasons.push("New short name is over 40 characters (" + shortName.length + " / 40)");
              }
              if (reasons.length > 0) {
                showReviewFeedback("Cannot accept: " + reasons.join(". ") + ".", true);
                return;
              }
              QSExisting.updateItemDecision(item, "accepted", {
                kindId: item.kindId,
                fields: values,
                shortName: shortName,
                longText: longText
              });
              refreshKindBarAndBadge();
              showReviewFeedback("Accepted and saved.", false);
            });

            document.getElementById("rev-skip-btn").addEventListener("click", function () {
              const values = readReviewValues();
              QSExisting.updateItemDecision(item, "skipped", {
                kindId: item.kindId,
                fields: values,
                shortName: String(shortBox.value || "").trim(),
                longText: String(longBox.value || "").trim()
              });
              refreshKindBarAndBadge();
              showReviewFeedback("Skipped and saved.", false);
            });

            document.getElementById("rev-not-kind-btn").addEventListener("click", function () {
              const origKind = item.kindId;
              QSExisting.updateItemDecision(item, "other", {
                kindId: "other",
                fields: null,
                shortName: "",
                longText: ""
              });
              const remaining = st.items.filter(function (it) { return it.kindId === origKind; });
              if (remaining.length > 0) {
                const nextInOrig = remaining.find(function (it) { return it.rowIndex > item.rowIndex; }) || remaining[0];
                triggerExistingTransition({ mode: "review", kindId: origKind, filter: view.filter || "all", search: view.search || "", limit: view.limit || 50, rowIndex: nextInOrig.rowIndex });
              } else {
                triggerExistingTransition({ mode: "list", kindId: origKind, filter: "all", search: "", limit: 50 });
              }
            });

            document.getElementById("rev-next-btn").addEventListener("click", function () {
              if (nextItem) {
                triggerExistingTransition(Object.assign({}, view, { rowIndex: nextItem.rowIndex }));
              }
            });
            return;
          }

          /* ----- MODE 2: LIST FOR ONE KIND ----- */
          if (view.mode === "list") {
            const stats = QSExisting.getKindStats().byId[view.kindId];
            if (!stats) {
              triggerExistingTransition({ mode: "overview" });
              return;
            }
            const kindItems = st.items.filter(function (it) { return it.kindId === view.kindId; });
            const acceptedPct = stats.total > 0 ? Math.round((stats.accepted / stats.total) * 100) : 0;
            const filterVal = view.filter || "all";
            const searchVal = String(view.search || "").trim().toLowerCase();
            const limitVal = view.limit || 50;

            const filtered = kindItems.filter(function (it) {
              if (filterVal !== "all" && it.status !== filterVal) return false;
              if (searchVal) {
                return (
                  it.materialNumber.toLowerCase().indexOf(searchVal) !== -1 ||
                  it.oldDescription.toLowerCase().indexOf(searchVal) !== -1
                );
              }
              return true;
            });

            const shown = filtered.slice(0, limitVal);
            const hasMore = filtered.length > shown.length;

            const filterButtonsHtml = (view.kindId === "other"
              ? [
                  { id: "all", label: "All (" + kindItems.length + ")" },
                  { id: "new", label: "New (" + stats.newCount + ")" },
                  { id: "other", label: "Moved (" + kindItems.filter(function (it) { return it.status === "other"; }).length + ")" }
                ]
              : [
                  { id: "all", label: "All (" + kindItems.length + ")" },
                  { id: "new", label: "New (" + stats.newCount + ")" },
                  { id: "accepted", label: "Accepted (" + stats.accepted + ")" },
                  { id: "skipped", label: "Skipped (" + stats.skipped + ")" }
                ]
            ).map(function (fb) {
              return '<button type="button" class="existing-filter-btn' + (filterVal === fb.id ? ' is-active' : '') + '" data-filter="' + fb.id + '">' + escHtml(fb.label) + '</button>';
            }).join("");

            const rowsHtml = shown.length === 0
              ? '<section class="card"><p class="placeholder-text">No materials match this filter.</p></section>'
              : shown.map(function (it) {
                  const bClass =
                    it.status === "accepted" ? "is-accepted" :
                    (it.status === "skipped" ? "is-skipped" :
                    (it.status === "other" ? "is-other" : "is-new"));
                  return (
                    '<button type="button" class="card existing-row-btn" data-row-index="' + it.rowIndex + '">' +
                      '<div class="existing-row-top">' +
                        '<span class="existing-mat-no">' + escHtml(it.materialNumber || "(No number)") + '</span>' +
                        '<span class="status-badge ' + bClass + '">' + escHtml(QSExisting.formatStatusLabel(it.status)) + '</span>' +
                      '</div>' +
                      '<p class="existing-old-text">' + escHtml(it.oldDescription || "(Empty description)") + '</p>' +
                    '</button>'
                  );
                }).join("") +
                (hasMore
                  ? '<button type="button" class="btn-secondary" id="existing-load-more-btn" style="width: 100%; min-height: 44px;">Show 50 more (' + (filtered.length - shown.length).toLocaleString() + ' left)</button>'
                  : '');

            pageRoot.innerHTML =
              '<div class="item-header card-stagger" style="--card-index: 0;">' +
                '<button type="button" class="back-btn" id="existing-list-back-btn" aria-label="Back to Existing materials">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                    '<path d="M15 18l-6-6 6-6"></path>' +
                  '</svg>' +
                '</button>' +
                '<h1 class="item-screen-title">' + escHtml(stats.name) + ' (' + stats.total.toLocaleString() + ')</h1>' +
              '</div>' +

              (view.kindId !== "other"
                ? '<section class="card card-stagger" style="--card-index: 1;">' +
                    '<div class="progress-header">' +
                      '<h2 class="card-label">Review progress</h2>' +
                      '<span class="progress-numbers">' + stats.accepted + ' / ' + stats.total + ' accepted</span>' +
                    '</div>' +
                    '<div class="progress-track">' +
                      '<div class="progress-fill is-grown" style="width: ' + acceptedPct + '%;"></div>' +
                    '</div>' +
                  '</section>'
                : '') +

              '<div class="rules-search-wrap card-stagger" style="--card-index: 2;">' +
                '<svg class="rules-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
                  '<circle cx="11" cy="11" r="7"></circle>' +
                  '<path d="m20 20-3.5-3.5"></path>' +
                '</svg>' +
                '<input id="existing-list-search" type="search" class="rules-search-input" value="' + escHtml(view.search || "") + '" placeholder="Search material number or old text..." aria-label="Search materials in kind" />' +
              '</div>' +

              '<div class="existing-filter-row card-stagger" style="--card-index: 3;">' + filterButtonsHtml + '</div>' +
              '<div id="existing-rows-wrap" class="existing-list card-stagger" style="--card-index: 4;">' + rowsHtml + '</div>';

            document.getElementById("existing-list-back-btn").addEventListener("click", function () {
              triggerExistingTransition({ mode: "overview" });
            });

            const searchBox = document.getElementById("existing-list-search");
            let searchTimer = null;
            searchBox.addEventListener("input", function () {
              const q = searchBox.value;
              if (searchTimer) clearTimeout(searchTimer);
              searchTimer = setTimeout(function () {
                renderExistingPage({ mode: "list", kindId: view.kindId, filter: filterVal, search: q, limit: 50 });
                const el = document.getElementById("existing-list-search");
                if (el) {
                  el.focus();
                  el.setSelectionRange(q.length, q.length);
                }
              }, 120);
            });

            pageRoot.querySelectorAll(".existing-filter-btn").forEach(function (btn) {
              btn.addEventListener("click", function () {
                const nextFilter = btn.getAttribute("data-filter") || "all";
                renderExistingPage({ mode: "list", kindId: view.kindId, filter: nextFilter, search: searchBox.value, limit: 50 });
              });
            });

            pageRoot.querySelectorAll(".existing-row-btn").forEach(function (btn) {
              btn.addEventListener("click", function () {
                const rIdx = parseInt(btn.getAttribute("data-row-index"), 10);
                triggerExistingTransition({ mode: "review", kindId: view.kindId, filter: filterVal, search: searchBox.value, limit: limitVal, rowIndex: rIdx });
              });
            });

            const loadMoreBtn = document.getElementById("existing-load-more-btn");
            if (loadMoreBtn) {
              loadMoreBtn.addEventListener("click", function () {
                renderExistingPage({ mode: "list", kindId: view.kindId, filter: filterVal, search: searchBox.value, limit: limitVal + 50 });
              });
            }
            return;
          }

          /* ----- MODE 1: OVERVIEW (UPLOAD + KIND TILES + REVIEW EXPORT) ----- */
          const hasData = st.items.length > 0;
          const totalCount = st.items.length;
          const kindStats = QSExisting.getKindStats();
          const acceptedTotal = st.items.filter(function (it) { return it.status === "accepted"; }).length;

          const mapperHtml = (hasData && !st.columnsAutoMatched && st.headers.length > 1)
            ? '<div class="existing-mapper-grid">' +
                '<div class="field-group">' +
                  '<label class="field-label" for="existing-map-mat">Material number column</label>' +
                  '<select id="existing-map-mat" class="field-control">' +
                    st.headers.map(function (h, idx) {
                      return '<option value="' + idx + '"' + (idx === st.matCol ? ' selected' : '') + '>' + escHtml((idx + 1) + ": " + (h || "(Blank header)")) + '</option>';
                    }).join("") +
                  '</select>' +
                '</div>' +
                '<div class="field-group">' +
                  '<label class="field-label" for="existing-map-desc">Old description column</label>' +
                  '<select id="existing-map-desc" class="field-control">' +
                    st.headers.map(function (h, idx) {
                      return '<option value="' + idx + '"' + (idx === st.descCol ? ' selected' : '') + '>' + escHtml((idx + 1) + ": " + (h || "(Blank header)")) + '</option>';
                    }).join("") +
                  '</select>' +
                '</div>' +
              '</div>'
            : '';

          const tilesHtml = hasData
            ? '<div class="stats-row card-stagger" style="--card-index: 1;">' +
                '<section class="card stat-card">' +
                  '<h2 class="card-label">Total materials</h2>' +
                  '<p class="stat-value">' + totalCount.toLocaleString() + '</p>' +
                '</section>' +
                '<section class="card stat-card">' +
                  '<h2 class="card-label">Accepted</h2>' +
                  '<p class="stat-value">' + acceptedTotal.toLocaleString() + '</p>' +
                '</section>' +
              '</div>' +
              '<div class="rules-grid card-stagger" style="--card-index: 2;">' +
                kindStats.list.map(function (k) {
                  const pct = k.total > 0 ? Math.round((k.accepted / k.total) * 100) : 0;
                  return (
                    '<button type="button" class="existing-kind-tile" data-kind-id="' + escHtml(k.id) + '">' +
                      '<div class="existing-kind-top">' +
                        '<div class="rule-tile-icon" style="background-color: ' + escHtml(k.tileBg) + '; color: ' + escHtml(k.tileColor) + ';">' +
                          k.iconSvg +
                        '</div>' +
                        '<p class="existing-kind-count">' + k.total.toLocaleString() + '</p>' +
                      '</div>' +
                      '<p class="rule-tile-name">' + escHtml(k.name) + '</p>' +
                      (k.id !== "other"
                        ? '<p class="existing-kind-sub">' + k.accepted.toLocaleString() + ' / ' + k.total.toLocaleString() + ' accepted</p>' +
                          '<div class="progress-track" style="height: 6px;"><div class="progress-fill is-grown" style="width: ' + pct + '%;"></div></div>'
                        : '<p class="existing-kind-sub">Tap to view items</p>') +
                    '</button>'
                  );
                }).join("") +
              '</div>'
            : '<section class="card card-stagger" style="--card-index: 1;">' +
                '<p class="placeholder-text">Upload your SAP .xlsx file to sort materials by kind, review each description, and download the checked Excel file.</p>' +
              '</section>';

          pageRoot.innerHTML =
            '<section class="card card-stagger" style="--card-index: 0;">' +
              '<h1 class="placeholder-title">Existing materials</h1>' +
              '<p class="placeholder-text">Reads SAP Excel offline on your phone and remembers accepted and skipped decisions.</p>' +
              '<div class="existing-hero-actions">' +
                '<button type="button" class="existing-upload-btn" id="existing-upload-btn">' + (hasData ? 'Upload another SAP Excel' : 'Upload SAP Excel') + '</button>' +
                '<input type="file" id="existing-file-input" class="existing-file-input" accept=".xlsx" />' +
                (hasData
                  ? '<button type="button" class="download-excel-btn" id="existing-download-btn">Download review Excel</button>'
                  : '') +
              '</div>' +
              (st.fileName ? '<p class="existing-file-meta">File: ' + escHtml(st.fileName) + '</p>' : '') +
              (hasData
                ? '<p class="existing-check-line" id="existing-rows-check">Rows in: ' + st.rawRows.length.toLocaleString() + '. Rows out: ' + totalCount.toLocaleString() + '.</p>'
                : '') +
              (st.error ? '<p class="existing-error-note" id="existing-error-note">' + escHtml(st.error) + '</p>' : '') +
              mapperHtml +
            '</section>' +

            '<section class="card' + (st.loading ? '' : ' is-hidden') + '" id="existing-progress-card" style="display: ' + (st.loading ? 'block' : 'none') + ';">' +
              '<div class="progress-header">' +
                '<h2 class="card-label" id="existing-progress-label">' + escHtml(st.progressText || "Reading Excel...") + '</h2>' +
                '<span class="progress-percent" id="existing-progress-pct">' + st.progressPct + '%</span>' +
              '</div>' +
              '<div class="progress-track">' +
                '<div class="progress-fill is-grown" id="existing-progress-fill" style="width: ' + st.progressPct + '%;"></div>' +
              '</div>' +
            '</section>' +
            tilesHtml;

          const uploadBtn = document.getElementById("existing-upload-btn");
          const fileInput = document.getElementById("existing-file-input");

          if (uploadBtn && fileInput) {
            uploadBtn.addEventListener("click", function () {
              fileInput.value = "";
              fileInput.click();
            });

            fileInput.addEventListener("change", function () {
              const file = fileInput.files && fileInput.files[0];
              if (!file) return;
              const progCard = document.getElementById("existing-progress-card");
              const progLabel = document.getElementById("existing-progress-label");
              const progPct = document.getElementById("existing-progress-pct");
              const progFill = document.getElementById("existing-progress-fill");
              if (progCard) progCard.style.display = "block";

              const reader = new FileReader();
              reader.onload = function (ev) {
                QSExisting.loadExcelArrayBuffer(ev.target.result, file.name, function (pct, text) {
                  if (progLabel) progLabel.textContent = text;
                  if (progPct) progPct.textContent = pct + "%";
                  if (progFill) progFill.style.width = pct + "%";
                }).then(function () {
                  triggerExistingTransition({ mode: "overview" });
                }).catch(function (err) {
                  st.loading = false;
                  st.error = "Could not read file: " + (err && err.message ? err.message : "Invalid .xlsx file");
                  triggerExistingTransition({ mode: "overview" });
                });
              };
              reader.onerror = function () {
                st.loading = false;
                st.error = "Could not read file from device.";
                triggerExistingTransition({ mode: "overview" });
              };
              reader.readAsArrayBuffer(file);
            });
          }

          const dlBtn = document.getElementById("existing-download-btn");
          if (dlBtn) {
            dlBtn.addEventListener("click", function () {
              const check = QSExisting.downloadReviewExcel();
              const checkLine = document.getElementById("existing-rows-check");
              if (check && checkLine) {
                checkLine.textContent = "Rows in: " + check.rowsIn.toLocaleString() + ". Rows out: " + check.rowsOut.toLocaleString() + ".";
              }
            });
          }

          const mapMat = document.getElementById("existing-map-mat");
          const mapDesc = document.getElementById("existing-map-desc");
          if (mapMat && mapDesc) {
            const onRemap = function () {
              QSExisting.remapColumns(parseInt(mapMat.value, 10), parseInt(mapDesc.value, 10)).then(function () {
                triggerExistingTransition({ mode: "overview" });
              });
            };
            mapMat.addEventListener("change", onRemap);
            mapDesc.addEventListener("change", onRemap);
          }

          pageRoot.querySelectorAll(".existing-kind-tile").forEach(function (tile) {
            tile.addEventListener("click", function () {
              const kindId = tile.getAttribute("data-kind-id");
              if (kindId) {
                triggerExistingTransition({ mode: "list", kindId: kindId, filter: "all", search: "", limit: 50 });
              }
            });
          });
        }

        function switchPage(pageId) {
          currentPage = pageId;
          cancelCountAnimations();

          navButtons.forEach(function (btn) {
            const isMatch = btn.getAttribute("data-page") === pageId;
            btn.classList.toggle("is-active", isMatch);
            if (isMatch) {
              btn.setAttribute("aria-current", "page");
            } else {
              btn.removeAttribute("aria-current");
            }
          });

          pageRoot.classList.remove("page-enter");
          void pageRoot.offsetWidth;

          if (pageId === "home") {
            renderHomePage();
          } else if (pageId === "rules") {
            renderRulesPage();
          } else if (pageId === "existing") {
            renderExistingPage();
          } else if (pageId === "export") {
            renderExportPage();
          }

          if (!prefersReducedMotion()) {
            pageRoot.classList.add("page-enter");
          }

          attachCardTouchLift(pageRoot);
        }

        navButtons.forEach(function (btn) {
          const parentItem = btn.closest(".nav-item");

          btn.addEventListener("touchstart", function () {
            if (parentItem) showSidebarLabel(parentItem);
          }, { passive: true });

          btn.addEventListener("click", function () {
            const target = btn.getAttribute("data-page");
            if (parentItem) showSidebarLabel(parentItem);
            if (target && target !== currentPage) {
              switchPage(target);
            }
          });
        });

        switchPage("home");
      })();
    </script>
  </body>
</html>
